    g.beginPath(); g.moveTo(AX0,AY0); g.lineTo(AX0+cs,AY0); g.lineTo(AX0,AY0+cs); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(AX0,AY1); g.lineTo(AX0+cs,AY1); g.lineTo(AX0,AY1-cs); g.closePath(); g.fill();
    g.fillStyle='rgba(59,130,246,.16)';
    g.beginPath(); g.moveTo(AX1,AY0); g.lineTo(AX1-cs,AY0); g.lineTo(AX1,AY0+cs); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(AX1,AY1); g.lineTo(AX1-cs,AY1); g.lineTo(AX1,AY1-cs); g.closePath(); g.fill();
    // 격자
    g.strokeStyle='rgba(30,27,46,.06)'; g.lineWidth=1;
    for(let x=AX0+40;x<AX1;x+=40){ g.beginPath(); g.moveTo(x,AY0); g.lineTo(x,AY1); g.stroke(); }
    for(let y=AY0+40;y<AY1;y+=40){ g.beginPath(); g.moveTo(AX0,y); g.lineTo(AX1,y); g.stroke(); }
    // 광택
    g.fillStyle='rgba(255,255,255,.28)';
    g.beginPath(); g.moveTo(AX0,AY0); g.lineTo(AX0+RW*0.42,AY0); g.lineTo(AX0,AY0+RH*0.42); g.closePath(); g.fill();
    // 센터 라인
    g.strokeStyle='rgba(30,27,46,.1)'; g.lineWidth=3; g.setLineDash([10,8]);
    g.beginPath(); g.moveTo(cx,AY0); g.lineTo(cx,cy-84); g.moveTo(cx,cy+84); g.lineTo(cx,AY1); g.stroke(); g.setLineDash([]);
    // 중앙 엠블럼
    g.strokeStyle='rgba(255,90,95,.16)'; g.lineWidth=12; g.beginPath(); g.arc(cx,cy,70,0,6.28); g.stroke();
    g.strokeStyle='rgba(30,27,46,.14)'; g.lineWidth=3;
    g.beginPath(); g.arc(cx,cy,84,0,6.28); g.stroke();
    g.beginPath(); g.arc(cx,cy,56,0,6.28); g.stroke();
    g.fillStyle='rgba(255,193,69,.38)'; g.beginPath();
    for(let i=0;i<10;i++){ const a=-Math.PI/2+i*Math.PI/5, rad=i%2?12:30; g.lineTo(cx+Math.cos(a)*rad,cy+Math.sin(a)*rad); }
    g.closePath(); g.fill();

    g.strokeStyle='#FF5A5F'; g.lineWidth=3; rr(AX0-4,AY0-4,RW+8,RH+8,13); g.stroke();
    // 모서리 기둥 (턴버클)
    [[AX0-7,AY0-7,'#FF5A5F'],[AX1+7,AY0-7,'#3B82F6'],[AX0-7,AY1+7,'#FF5A5F'],[AX1+7,AY1+7,'#3B82F6']].forEach(p=>{
      g.fillStyle='#FFC145'; g.beginPath(); g.arc(p[0],p[1],11,0,6.28); g.fill();
      g.strokeStyle='#1E1B2E'; g.lineWidth=3; g.stroke();
      g.fillStyle=p[2]; g.beginPath(); g.arc(p[0],p[1],5,0,6.28); g.fill();
    });
    g.restore();
  }

  function drawWeapon(b){
    if(b.type==='none') return;
    g.save(); g.translate(b.x,b.y); g.rotate(b.ang);
    g.lineCap='round'; g.strokeStyle='#1E1B2E';
    if(b.type==='sword'){
      g.fillStyle='#7a4a2a'; rr(b.r-4,-4,10,8,2); g.fill(); g.lineWidth=2; g.stroke();
      g.fillStyle='#1E1B2E'; g.fillRect(b.r+5,-8,4,16);
      g.beginPath(); g.moveTo(b.r+9,-4.5); g.lineTo(b.r+b.len-6,-4.5); g.lineTo(b.r+b.len,0); g.lineTo(b.r+b.len-6,4.5); g.lineTo(b.r+9,4.5); g.closePath();
      g.fillStyle=b===player?'#E9F7F5':'#E3E8EF'; g.fill(); g.lineWidth=2.2; g.stroke();
      g.strokeStyle='rgba(30,27,46,.25)'; g.lineWidth=1; g.beginPath(); g.moveTo(b.r+11,0); g.lineTo(b.r+b.len-7,0); g.stroke();
    } else if(b.type==='spear'){
      g.strokeStyle='#1E1B2E'; g.lineWidth=6; g.beginPath(); g.moveTo(b.r-2,0); g.lineTo(b.r+b.len-12,0); g.stroke();
      g.strokeStyle='#a0703f'; g.lineWidth=3.5; g.beginPath(); g.moveTo(b.r-2,0); g.lineTo(b.r+b.len-12,0); g.stroke();
      g.beginPath(); g.moveTo(b.r+b.len-14,-7); g.lineTo(b.r+b.len,0); g.lineTo(b.r+b.len-14,7); g.closePath();
      g.fillStyle='#cfd6e0'; g.fill(); g.strokeStyle='#1E1B2E'; g.lineWidth=2; g.stroke();
    } else {
      g.strokeStyle='#1E1B2E'; g.lineWidth=5; g.beginPath(); g.moveTo(b.r-2,0); g.lineTo(b.r+b.len,0); g.stroke();
      g.translate(b.r+b.len+11,0); g.rotate(t*12);
      g.beginPath();
      for(let i=0;i<16;i++){ const a=i/16*6.283, rad=i%2?8:12.5; g.lineTo(Math.cos(a)*rad,Math.sin(a)*rad); }
      g.closePath(); g.fillStyle='#d9dee6'; g.fill(); g.lineWidth=2; g.stroke();
      g.fillStyle='#1E1B2E'; g.beginPath(); g.arc(0,0,3,0,6.28); g.fill();
    }
    g.restore();
  }

  function drawBall(b,color){

    g.save(); g.translate(b.x,b.y); g.scale(sc,sc);

      const fl=Math.sin(t*30);

    }
    // 손바닥 반동: 아파서 부들부들
    const pain=isPain(b);
    if(pain){
      g.translate(Math.sin(t*45)*2.5,Math.cos(t*37)*1.2);
      g.rotate(Math.sin(t*22)*0.08);
    }
    // 변신 중 덜덜 / 회피 중 잔상
    if(b.morphT>0) g.translate(Math.sin(t*60)*3,Math.cos(t*47)*2);
    if(b.dmT>0) g.translate(Math.sin(t*70)*2,Math.cos(t*53)*2);

        }
      }
    }
    g.restore();
  }

  function draw(){
    g.setTransform(DPR,0,0,DPR,0,0);
    g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
    g.clearRect(0,0,W,H);
    // 링 안 세상은 배율을 적용해서 그림
    const editShift=gameSettings.effects?editShakeOffset():{x:0,y:0};
    g.setTransform(DPR*CAM.s,0,0,DPR*CAM.s,DPR*(CAM.ox+editShift.x),DPR*(CAM.oy+editShift.y));
    drawArena();
    if(!gameSettings.effects){
      drawQuietBattle();
    }else{
    drawWater();

    // 물결 (링 안에서만 보이게)
    g.save(); rr(AX0,AY0,AX1-AX0,AY1-AY0,10); g.clip();
    for(const w of waves){
      const a=Math.max(0,1-w.r/w.max), ox=w.o.x, oy=w.o.y;
      g.globalAlpha=0.25*a; g.fillStyle='#3BA7F0';
      g.beginPath(); g.arc(ox,oy,w.r,0,6.28); g.fill();
      g.globalAlpha=0.9*a; g.strokeStyle='#3BA7F0'; g.lineWidth=6;
      g.beginPath(); g.arc(ox,oy,w.r,0,6.28); g.stroke();
      g.strokeStyle='#E6F6FF'; g.lineWidth=2;
      g.beginPath(); g.arc(ox,oy,w.r-2,0,6.28); g.stroke();
      g.fillStyle='#BDE6FF';
      for(let i=0;i<16;i++){ const an=i/16*6.283+w.r*0.02; g.beginPath(); g.arc(ox+Math.cos(an)*(w.r+6),oy+Math.sin(an)*(w.r+6),3,0,6.28); g.fill(); }
      g.globalAlpha=1;
    }
    // 최강록 조림: 퍼지는 국물 파동 + 냄비 쾅
    for(const j of jfx){
      const k=j.t/1.1;
      g.save();
      if(k<0.6){
        const a=1-k/0.6, rad=90*(0.5+k);
        g.globalAlpha=a*0.75;
        const hg=g.createRadialGradient(j.x,j.y,0,j.x,j.y,rad);
        hg.addColorStop(0,'rgba(255,240,180,1)'); hg.addColorStop(0.5,'rgba(255,170,70,0.7)'); hg.addColorStop(1,'rgba(200,110,40,0)');
        g.fillStyle=hg; g.beginPath(); g.arc(j.x,j.y,rad,0,6.283); g.fill();
      }
      for(let i=0;i<3;i++){
        const kk=k*1.3-i*0.15; if(kk<=0||kk>1) continue;
        const rad=20+kk*440;
        g.globalAlpha=(1-kk)*0.7; g.strokeStyle=i===1?'#FFD27A':'#A0522D'; g.lineWidth=14*(1-kk)+2;
        g.beginPath(); g.arc(j.x,j.y,rad,0,6.283); g.stroke();
        g.fillStyle='#E0A458';
        for(let q=0;q<14;q++){ const an=q/14*6.283+i; g.beginPath(); g.arc(j.x+Math.cos(an)*rad,j.y+Math.sin(an)*rad,3+3*(1-kk),0,6.283); g.fill(); }
      }
      const al=Math.max(0,1-Math.max(0,k-0.7)/0.3);
      g.textAlign='center'; g.textBaseline='middle';
      j.hits.forEach(function(e){
        if(!e||e.dead) return;
        const dk=Math.min(1,k/0.25), sz=Math.round(e.r*1.3);
        const py=e.y-e.r-sz*0.4-(1-dk*dk)*130, bounce=dk>=1?Math.sin(Math.min(1,(k-0.25)/0.15)*3.14)*6:0;
        g.globalAlpha=al;
        g.font=sz+'px sans-serif'; g.fillText('🍲',e.x,py-bounce);
        if(dk>=1){
          g.fillStyle='#FFFFFF';
          for(let q=0;q<3;q++){ const sk=((k-0.25)*2+q*0.3)%1; g.globalAlpha=al*(1-sk)*0.8; g.beginPath(); g.arc(e.x+(q-1)*sz*0.3+Math.sin(sk*6+q)*4,py-sz*0.5-sk*40,4+sk*6,0,6.283); g.fill(); }
        }
      });
      g.restore();
    }
    // 히든 백수저 최강록: 링 바닥의 들기름 웅덩이
    for(const o of oils){
      const k=Math.min(1,o.t/0.35), fade=Math.min(1,o.life/1.5);
      g.save(); g.globalAlpha=0.92*fade;
      if(k<1){
        g.fillStyle='#E8B32E'; g.beginPath(); g.arc(o.x,o.y-(1-k)*60,5,0,6.283); g.fill();
      } else {
        const gr=g.createRadialGradient(o.x-o.r*0.3,o.y-o.r*0.25,2,o.x,o.y,o.r);
        gr.addColorStop(0,'#FFF6CC'); gr.addColorStop(0.35,'#E8B32E'); gr.addColorStop(1,'rgba(176,118,16,0.8)');
        g.fillStyle=gr; g.beginPath(); g.ellipse(o.x,o.y,o.r,o.r*0.72,0,0,6.283); g.fill();
        g.strokeStyle='#8A5A00'; g.lineWidth=1.5; g.stroke();
        g.fillStyle='rgba(255,255,255,0.7)'; g.beginPath(); g.ellipse(o.x-o.r*0.35,o.y-o.r*0.25,o.r*0.22,o.r*0.1,-0.4,0,6.283); g.fill();
      }
      g.restore();
    }
    // 서준이 제로산소: 링 전체 광역 (단계가 오를수록 짙어지고, 1초마다 파동)
    for(const P of F){
      if(!P.c.o2||P.dead||P.o2Lv<=0) continue;
      const pu=P.o2Pulse||0;
      g.globalAlpha=Math.min(0.28,0.05+0.025*(P.o2Lv/P.c.o2.step))+0.16*pu;
      g.fillStyle='#5FB7D4'; g.fillRect(AX0,AY0,AX1-AX0,AY1-AY0);
      if(pu>0){
        const rad=(1-pu)*560;

      }
      // 링 전체에 떠다니는 빈 공기방울

    for(const s of inks){
      const M=s.o.c.mono; if(!M) continue;

      g.closePath(); g.fill();
      for(let i=0;i<6;i++){ const a=i*1.05+s.seed, d=(44+(i%3)*8)*k; g.beginPath(); g.arc(Math.cos(a)*d,Math.sin(a)*d*0.8,3+(i%2)*2,0,6.28); g.fill(); }
      if(!s.done){
        g.globalAlpha=0.5+0.4*Math.sin(t*30); g.strokeStyle='#fff'; g.lineWidth=2; g.setLineDash([5,5]);
        g.beginPath(); g.arc(0,0,M.radius*bossR(s.o),0,6.28); g.stroke(); g.setLineDash([]);
        g.fillStyle='#fff'; g.globalAlpha=0.9;
        g.beginPath(); g.arc(-6,-4,2.5,0,6.28); g.arc(6,-4,2.5,0,6.28); g.fill();
      }
      g.restore();
    }

    const drawList=F.filter(function(f){ return !f.dead && !f.eaten && !(state==='dead' && f!==winner && overTimer<0.6); }).concat(minions);
    for(const f of drawList) drawBall(f,f.color);
    drawBonus();
    // 수투두오: 원숭이두창 투척물

      g.strokeStyle='#1E1B2E'; g.lineWidth=2.5; g.stroke();
      g.fillStyle='#C2185B';
      [[-4,-3],[4,-4],[0,4],[-5,4],[5,3]].forEach(function(q){ g.beginPath(); g.arc(q[0]*rr3/10,q[1]*rr3/10,rr3*0.2,0,6.28); g.fill(); });
      g.restore();
    }
    // 나우아임영: 날아가는 KC 글씨
    for(const p of kcs){
      g.save(); g.translate(p.x,p.y); g.rotate(p.rot);

    if(to&&to.base) to=to.base;
    if(to&&to.isMinion) to=to.owner;

  function partySyncTeam(f,tm){
    const group=[f];
    if(rule==='zombie'){
      for(let i=0;i<group.length;i++){
        const current=group[i];
        F.forEach(function(a){
          const linked=a.duoOf===current||a.koalaMother===current||a.koalaSwarmOwner===current||
            current.duoOf===a||current.koalaMother===a||current.koalaSwarmOwner===a;
          if(linked&&group.indexOf(a)<0) group.push(a);
        });
      }
    } else {
      F.forEach(function(a){ if(a.duoOf===f) group.push(a); });

  function partyHasEvolutionLeft(f){
    const c=f.c;
    if(!customCanEvolve(f)) return false;
    if(f.morphT>0||f.mgT>0||f.dmT>0||f.wzT>0||f.r100T>0||f.downT>0) return true;
    if(c.waterAwaken&&!f._waterAwakened) return true;
    if(c.bonusKind==='hhh') return (c.letterStage||0)<2;
    if(c.bonusKind==='koala'&&!f.koalaSwarmOwner){
      return (f.koalaStage||0)<(f.koalaMother?1:3);

    if(c.extraSkills&&c.extraSkills.some(function(s){ return s.kind==='duolingoRage'; })){
      return !(f.extraGuest&&f.extraGuest.duolingoRage);

  function partyResolve(){
    if(rule==='bomb'&&partyExpired){
      const f=partyExpired;

        play('blow');
      }
      partyBomb=null;
    }
    if(rule!=='zombie') return;
    const fallen=F.filter(function(f){ return !f.dead&&f.hp<=0; });
    if(!fallen.length) return;
    const teams=new Map(), owners=new Map();
    F.forEach(function(f){
      teams.set(f,f.team);
      owners.set(f,f._zombieOwner||f.name);
    });
    const changes=fallen.map(function(f){
      let by=f._lastBy;
      if(by&&by.isMinion) by=by.owner;
      if(!by||by===f||!teams.has(by)||teams.get(by)===teams.get(f)){
        by=F.filter(function(a){ return a!==f&&!a.dead&&a.hp>0&&a.team!==f.team; })
          .sort(function(a,b){ return Math.hypot(a.x-f.x,a.y-f.y)-Math.hypot(b.x-f.x,b.y-f.y); })[0];
      }
      if(!by) return {f:f,by:null,team:teams.get(f),owner:owners.get(f),revive:true};
      let root=by;
      const seen=[f];
      while(root&&fallen.indexOf(root)>=0){
        if(seen.indexOf(root)>=0){
          root=seen.concat([root]).sort(function(a,b){ return teams.get(a)-teams.get(b); })[0];
          break;
        }
        seen.push(root);
        let next=root._lastBy;
        if(next&&next.isMinion) next=next.owner;
        if(!next||!teams.has(next)||next===root) break;
        root=next;
      }
      return {f:f,by:by,team:teams.get(root||by),owner:owners.get(root||by)};
    }).filter(Boolean);
    changes.forEach(function(q){
      const f=q.f;
      f.team=q.team;
      f._isZombie=true;
      f._zombieOwner=q.owner;
      f.dead=false;
      f._candyKo=false;

      const evolving=partyHasEvolutionLeft(f);

      try{

      if(!evolving){

      if(q.by) q.by._ko=(q.by._ko||0)+1;
      FX.popText(f.x,f.y-40,'🧟 '+q.owner+(q.revive?' 팀 유지':' 팀 합류!')+
        (evolving?' · 진화 유지':' · 체력 회복!'),{color:'#348B52',size:19});
      FX.sparkle(f.x,f.y);
      play('morph');
    });
  }

    // 전환 전 DOM이 직렬화된다 — 두 프레임 양보로 레이아웃·페인트가 정착한 뒤 찍는다.
    function settle(fn){ try { requestAnimationFrame(function(){ requestAnimationFrame(fn); }); } catch(e){ fn(); } }
    try {
      settle(function(){
        try {
          window.__pfCaptureShoot()
            .then(function(payload){ reply(payload); })
            .catch(function(){ reply(null); });
        } catch(e){ reply(null); }
      });
    } catch(e){ reply(null); }
  });
})();
</script>
