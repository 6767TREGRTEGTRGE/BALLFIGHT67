<script>
(function(){
  function initHtmlCopy(){
    if(!(window.tapit && window.tapit.dev)) return;
    const htmlSource='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    const button=document.createElement('button');
    button.type='button';
    button.textContent='HTML 복사';
    button.style.cssText='position:absolute;left:244px;top:6px;width:112px;height:44px;z-index:10000;border:2px solid #FFC145;border-radius:12px;background:#1E1B2E;color:#FFC145;font:800 13px sans-serif;cursor:pointer;';
    document.body.appendChild(button);
    let busy=false, resetTimer;
    function notify(text){
      button.textContent=text;
      clearTimeout(resetTimer);
      resetTimer=setTimeout(function(){button.textContent='HTML 복사';},2200);
    }
    function fallbackCopy(){
      const existing=document.getElementById('devHtmlCopyBox');
      if(existing){
        const area=existing.querySelector('textarea');
        area.focus();area.select();area.setSelectionRange(0,area.value.length);
        return existing;
      }
      const box=document.createElement('div');
      box.id='devHtmlCopyBox';
      box.style.cssText='position:absolute;left:120px;top:62px;width:360px;box-sizing:border-box;padding:12px;z-index:10001;display:flex;flex-direction:column;gap:8px;background:#1E1B2E;color:#F4EBDD;border:2px solid #FFC145;border-radius:12px;font:13px sans-serif;';
      const hint=document.createElement('div');
      hint.textContent='아래는 게임의 전체 HTML 코드예요. 자동 복사가 확인되지 않으면 입력칸을 길게 눌러 전체 선택 → 복사를 눌러 주세요.';
      const area=document.createElement('textarea');
      area.readOnly=true;
      area.spellcheck=false;
      area.setAttribute('aria-label','복사할 HTML 전체');
      area.style.cssText='box-sizing:border-box;width:100%;height:200px;resize:none;user-select:text;-webkit-user-select:text;touch-action:pan-y;font:12px monospace;';
      area.value=htmlSource;
      area.addEventListener('copy',function(e){
        if(!e.clipboardData) return;
        e.clipboardData.setData('text/plain',htmlSource);
        e.preventDefault();
        notify('복사 요청됨');
      });
      const row=document.createElement('div');
      row.style.cssText='display:flex;gap:8px;flex-shrink:0;';
      const select=document.createElement('button'), close=document.createElement('button');
      [select,close].forEach(function(b){
        b.type='button';
        b.style.cssText='flex:1;min-height:44px;border:0;border-radius:8px;background:#F4EBDD;color:#1E1B2E;font:800 14px sans-serif;cursor:pointer;';
        row.appendChild(b);
      });
      select.textContent='전체 선택';
      close.textContent='닫기';
      function selectAll(){area.focus();area.select();area.setSelectionRange(0,area.value.length);}
      select.addEventListener('click',function(){
        selectAll();
        hint.textContent='전체 코드를 선택했어요. 입력칸을 길게 눌러 복사를 누르거나 Ctrl+C / ⌘C를 눌러 주세요.';
      });
      close.addEventListener('click',function(){box.remove();button.focus();});
      box.appendChild(hint);box.appendChild(area);box.appendChild(row);
      document.body.appendChild(box);
      selectAll();
      return box;
    }
    button.addEventListener('click',async function(){
      if(busy) return;
      busy=true;
      const box=fallbackCopy();
      const hint=box.firstElementChild;
      notify('전체 코드 표시');
      function bounded(p){
        return new Promise(function(resolve,reject){
          const timer=setTimeout(function(){reject(new Error('timeout'));},2500);
          Promise.resolve(p).then(function(v){clearTimeout(timer);resolve(v);},function(e){clearTimeout(timer);reject(e);});
        });
      }
      try{
        if(!navigator.clipboard || typeof navigator.clipboard.writeText!=='function') throw new Error('clipboard');
        await bounded(navigator.clipboard.writeText(htmlSource));
        if(typeof navigator.clipboard.readText!=='function') throw new Error('unverified');
        const copied=await bounded(navigator.clipboard.readText());
        if(copied!==htmlSource) throw new Error('mismatch');
        if(box.isConnected) hint.textContent='전체 HTML 코드가 클립보드에 들어간 것을 확인했어요. 원하는 곳에 붙여넣어 보세요.';
        notify('복사 확인 완료!');
      }catch(e){
        if(box.isConnected) hint.textContent='자동 복사를 확인할 수 없어요. 아래 입력칸을 길게 눌러 전체 선택 → 복사를 누르거나, 전체 선택 후 Ctrl+C / ⌘C를 눌러 주세요.';
        notify('직접 복사해 주세요');
      }finally{busy=false;}
    });
  }
  if(document.readyState!=='loading') initHtmlCopy();
  else document.addEventListener('DOMContentLoaded',initHtmlCopy,{once:true});
})();
</script>

  function rdsyWatermarkBox(W){
    const R=TUNING.rdsy, rw=AX1-AX0, rh=AY1-AY0;
    const flat=Math.max(0.04,Math.min(0.5,R.watermarkFlat));
    const enter=Math.max(0,Math.min(1,W.fallTime/Math.max(0.1,R.watermarkFall)));
    const p=W.falling?0.8+enter*0.2:0.8*Math.max(0,Math.min(1,W.time/Math.max(0.1,R.watermarkSquash)));
    const scale=1-0.55*(enter*enter*(3-2*enter));
    return {x:W.x===undefined?(AX0+AX1)/2:W.x,y:W.y===undefined?(AY0+AY1)/2:W.y,
      w:rw*0.94*scale,h:rh*0.9*(1-(1-flat)*p)*scale};
  }
  function updateRdsyWatermarks(dt){
    const R=TUNING.rdsy;
    F.forEach(function(o){
      const W=o.rdsyWatermark;
      if(!W) return;
      if((o.dead || o.hp<=0) && !W.landed){ o.rdsyWatermark=null; return; }
      if(!W.falling){
        W.time+=dt;
        if(W.voiceStarted && (S.rdsyWatermark.ended || S.rdsyWatermark.paused || S.rdsyWatermark.error)) W.voiceDone=true;
        if(W.voiceDone && W.time>=Math.max(0.1,R.watermarkSquash)){
          W.falling=true;
        }
        return;
      }
      if(!W.landed){
        W.fallTime=Math.min(Math.max(0.1,R.watermarkFall),W.fallTime+dt);
        if(W.fallTime>=Math.max(0.1,R.watermarkFall)){
          W.landed=true;
          const b=rdsyWatermarkBox(W);
          FX.burst(b.x,b.y,{count:12,colors:['#FFFFFF','#50ED86','#674FFF'],speed:5,size:5});
        }else{
          return;
        }
      }else{
        W.activeTime+=dt;
      }
      if(W.activeTime>=3){
        o.rdsyWatermark=null;
        return;
      }
      const b=rdsyWatermarkBox(W);
      if(W.vx!==undefined){
        const left=AX0+b.w/2, right=AX1-b.w/2;
        const upper=AY0+b.h/2, lower=AY1-b.h/2;
        W.x=b.x+W.vx*dt;
        W.y=b.y+W.vy*dt;
        if(W.x<left || W.x>right){
          W.x=Math.max(left,Math.min(right,W.x));
          W.vx=W.x===left?Math.abs(W.vx):-Math.abs(W.vx);
        }
        if(W.y<upper || W.y>lower){
          W.y=Math.max(upper,Math.min(lower,W.y));
          W.vy=W.y===upper?Math.abs(W.vy):-Math.abs(W.vy);
        }
        b.x=W.x; b.y=W.y;
      }
      const top=b.y-b.h/2;
      const bottom=b.y+b.h/2;
      let bounced=false;
      alive().forEach(function(v){
        if(bounced || W.hits.size>=3 || v===o || v.team===o.team || v.dead || v.hp<=0 || v.eaten || W.hits.has(v)) return;
        const nx=Math.max(b.x-b.w/2,Math.min(v.x,b.x+b.w/2));
        const ny=Math.max(top,Math.min(v.y,bottom));
        if(Math.hypot(v.x-nx,v.y-ny)>v.r) return;
        if(bonusDamage(o,v,R.watermarkDamage,'워터마크',true)){
          W.hits.add(v);
          bounced=true;
          W.activeTime=0;
          W.x=b.x; W.y=b.y;
          const targets=alive().filter(function(t){
            return t!==o && t.team!==o.team && !t.dead && t.hp>0 && !t.eaten && !W.hits.has(t);
          });
          targets.sort(function(a,c){
            return Math.hypot(a.x-b.x,a.y-b.y)-Math.hypot(c.x-b.x,c.y-b.y);
          });
          const next=targets[0];
          const bounceAngle=next?Math.atan2(next.y-b.y,next.x-b.x):
            Math.atan2(b.y-v.y,b.x-v.x);
          W.vx=Math.cos(bounceAngle)*R.throwSpeed;
          W.vy=Math.sin(bounceAngle)*R.throwSpeed;
          v._lastBy=o;
          const dx=v.x-b.x, dy=v.y-b.y;
          const angle=Math.hypot(dx,dy)>0.001?Math.atan2(dy,dx):Math.atan2(v.vy||0,v.vx||1);
          const speed=Math.max(TUNING.hitKnock,Math.hypot(v.vx||0,v.vy||0));
          v.vx=Math.cos(angle)*speed;
          v.vy=Math.sin(angle)*speed;
          play('hit');
          FX.burst(v.x,v.y,{count:12,colors:['#FFFFFF','#3DCB72','#8866FF'],speed:6,size:5});
          FX.popText(v.x,v.y-30,'워터마크 -'+R.watermarkDamage,{color:'#3DCB72',size:18});
        }
      });
    });
  }

  function updateLetterForms(dt){
    const H=TUNING.guests.hhh;

      const e=v._letterShock;

        delete v._letterShock;
        return;
      }
      const step=Math.min(dt,e.left);
      e.left=Math.max(0,e.left-step);
      e.acc+=step;
      while(e.acc+0.000001>=H.electricInterval && e.ticks>0){
        e.acc-=H.electricInterval;
        e.ticks--;
        if(bonusCanHit(v) && (rule!=='chase'||(e.o.team===0&&chaseNear(e.o,v)))){
          bonusDamage(e.o,v,H.electricDamage,'M의 전기',true);
        }
        if(v.hp<=0) break;
      }
      if(e.left<=0 || e.ticks<=0) delete v._letterShock;
    });
    F.slice().forEach(function(o){
      if(o.c.bonusKind!=='hhh' || o.dead || o.hp<=0) return;
      if(o.c.letterStage===2){
        if(letterCanAct(o)) summonLetterArmy(o);
      }else if(o.c.letterStage===1 && letterCanAct(o)){
        o._letterCd=Math.max(0,(o._letterCd===undefined?H.mCooldown:o._letterCd)-dt);
        const v=nearestEnemy(o);
        if(o._letterCd<=0 && bonusCanHit(v) && (rule!=='chase'||chaseNear(o,v))){
          o._letterCd=H.mCooldown;
          letterShot(o,v,'M',H.mDamage);
        }
      }
    });
    minions.forEach(function(m){
      if(!m.letterSoldier || m.dead || m.hp<=0) return;
      if(m.owner) m.team=m.owner.team;
      if(!letterCanAct(m)) return;
      m._letterCd=Math.max(0,(m._letterCd===undefined?H.sssCooldown:m._letterCd)-dt);
      const v=nearestEnemy(m);
      if(m._letterCd<=0 && bonusCanHit(v) && (rule!=='chase'||chaseNear(m,v))){
        m._letterCd=H.sssCooldown;
        letterShot(m,v,'S',H.sssDamage);
      }
    });
    const pool=alive();
    F.concat(minions).forEach(function(o){
      if(!o._letterShots) return;
      if(o.dead || o.hp<=0 || (!o.letterSoldier&&o.c.bonusKind!=='hhh')){
        o._letterShots=[];

            dSegPt(p.x,p.y,x,y,v.x,v.y)<=v.r+7;
        }).sort(function(a,b){
          return Math.hypot(a.x-p.x,a.y-p.y)-Math.hypot(b.x-p.x,b.y-p.y);
        });
        if(hits.length){
          const v=hits[0];
          bonusDamage(o,v,p.damage,p.electric?'M의 활력':'S 던지기',false);
          if(p.electric && v.hp>0){
            v._letterShock={o:o,left:H.electricDuration,acc:0,

            FX.sparkle(v.x,v.y);

  function clearKoalaSwarm(o){
    F=F.filter(function(f){
      if(f.koalaSwarmOwner!==o) return true;
      f.dead=true;
      f.hp=0;
      return false;
    });
  }
  function syncKoalaSwarm(dt){
    const K=TUNING.koalaBee;
    F=F.filter(function(f){
      const o=f.koalaSwarmOwner;
      if(!o) return true;
      const sibling=typeof f.koalaSiblingLeft==='number';
      if(sibling) f.koalaSiblingLeft=Math.max(0,f.koalaSiblingLeft-(dt||0));
      if(!f.dead && F.indexOf(o)>=0 && !o.dead && o.hp>0 &&
        !o.eaten && o.c.bonusKind==='koala' &&
        (sibling ? f.koalaSiblingLeft>0 : !(o.koalaStage>0))) return true;
      f.dead=true;
      f.hp=0;
      return false;
    });
    F.slice().forEach(function(o){
      if(o.dead || o.hp<=0 || o.eaten || o.c.bonusKind!=='koala' ||
        o.koalaMother || o.koalaSwarmOwner || !customCanSummon(o)) return;
      const sibling=o.koalaStage===2;
      if(sibling){
        if(o.koalaSiblingSwarmMade) return;
        o.koalaSiblingSwarmMade=true;
      } else {
        if(o.koalaStage>0 || o.koalaSwarmMade) return;
        o.koalaSwarmMade=true;
      }
      const count=sibling?K.siblingCount:2;
      const angle=Math.random()*Math.PI*2;
      for(let i=0;i<count;i++){
        const a=angle+i*Math.PI*2/count;
        const bee=makeFighter(o.c,o.x,o.y,1);
        bee.x+=Math.cos(a)*(o.r+bee.r+6);
        bee.y+=Math.sin(a)*(o.r+bee.r+6);
        bee.team=o.team;
        bee.rid=o.rid;
        if(mode==='boss' && o.isBoss){
          bee.isBoss=true;
          bee.bossMul=o.bossMul;
          bee.r*=TUNING.bossSize;
        } else if(rule==='monster' && monsterRoleOf(o)===4){
          bee.r*=TUNING.bossSize;
        }
        bee.koalaStage=sibling?1:0;
        bee.koalaSwarmOwner=o;
        bee._abilityRoll=o._abilityRoll;
        bee.hp=bee.maxHp=((mode==='boss' && o.isBoss)||(rule==='monster' && monsterRoleOf(o)===4))?1000:o.maxHp;
        if(sibling){
          bee.name='동생 코알라말벌';
          bee.koalaSiblingLeft=K.siblingDuration;
          bee.hp=bee.maxHp=Math.round(25*(mode==='boss' && o.isBoss?(o.bossMul||1):1));
          if(bee.bonusCds) bee.bonusCds.sting=K.stingCooldownByStage[1];
        }
        if(rule==='zombie'){
          bee._isZombie=!!o._isZombie;
          bee._zombieOwner=o._zombieOwner||o.name;
        }
        if(rule==='onehp') bee.hp=bee.maxHp=1;
        bee.hp0=bee.hp;
        bee.spawnT=0.6;
        walls(bee,false);
        rv(bee);
        if(sibling){
          bee.vx*=K.speedByStage[1]/K.speedByStage[0];
          bee.vy*=K.speedByStage[1]/K.speedByStage[0];
        }
        F.push(bee);
        FX.sparkle(bee.x,bee.y);
      }
    });
  }
  function updateIsagi(dt){
    const I=TUNING.isagi;
    F.forEach(function(o){
      if(o.c.bonusKind!=='isagi') return;
      if(o.dead || o.hp<=0){ o.isagiShots=[]; return; }
      if(o.eaten || waterSafe(o)) return;
      if(!o.isagiShots) o.isagiShots=[];
      if(o.isagiAccuracy===undefined) o.isagiAccuracy=I.baseAccuracy;
      for(let i=o.isagiShots.length-1;i>=0;i--){
        const p=o.isagiShots[i], v=p.target;
        p.left-=dt;
        if(p.left<=0 || F.indexOf(v)<0 || !bonusCanHit(v) || v.team===o.team){
          o.isagiShots.splice(i,1);
          continue;
        }
        const dx=v.x-p.x,dy=v.y-p.y,d=Math.hypot(dx,dy);
        const travel=I.ballSpeed*dt;
        p.angle=(p.angle||0)+dt*11;
        if(d<=v.r+I.ballRadius+travel){
          if(Math.random()<p.accuracy){
            if(bonusDamage(o,v,I.damage,'축구',false)){
              FX.burst(v.x,v.y,{count:10,colors:['#FFFFFF','#357ABB','#56A85E'],speed:4});
            }
          } else {
            FX.popText(v.x,v.y-v.r-14,'빗나감',{color:'#D0D7DC',size:16});
          }
          o.isagiShots.splice(i,1);
        } else {
          p.x+=dx/d*travel;
          p.y+=dy/d*travel;
        }
      }
      if(o.stun>0) return;
      const v=nearestEnemy(o);
      if(!bonusCanHit(v)) return;
      if(!o.bonusCds) o.bonusCds={};
      const C=o.bonusCds;
      if(C.isagiKick===undefined) C.isagiKick=I.kickCooldown;
      if(C.isagiVision===undefined) C.isagiVision=I.visionCooldown;
      if(C.isagiVision<=0){
        C.isagiVision=I.visionCooldown;
        o.isagiAccuracy=Math.min(I.maxAccuracy,o.isagiAccuracy+I.accuracyGain);
        shout(o,'뛰어난 시각능력!',o.color,0.9);
        FX.popText(o.x,o.y-o.r-18,'명중률 '+Math.round(o.isagiAccuracy*100)+'%',{color:'#68C77B',size:16});
        FX.sparkle(o.x,o.y);
        play('isagiVision');
      }
      if(C.isagiKick<=0){
        C.isagiKick=I.kickCooldown;
        const a=Math.atan2(v.y-o.y,v.x-o.x);
        o.isagiShots.push({
          x:o.x+Math.cos(a)*(o.r+I.ballRadius),
          y:o.y+Math.sin(a)*(o.r+I.ballRadius),
          target:v,accuracy:o.isagiAccuracy,left:I.ballLife,angle:0
        });
        shout(o,'축구!',o.color,0.8);
        FX.burst(o.x,o.y,{count:6,colors:['#FFFFFF','#357ABB'],speed:3});
        play('isagiKick');
      }
    });
  }

  function updateNay(dt){

    minions.forEach(function(m){
      if(!m.c.haon||m.hp<=0) return;
      m.ptCd-=dt;
      if(m.ptCd<=0){
        m.ptCd=m.ptEvery; m.ptN++;
        m.r=Math.min(m.r0*2,m.r*1.07); m.maxHp+=10; m.hp+=10; m.dmgC+=5;
        walls(m,false);
        shout(m,'yarr! 🥤 프로틴 '+m.ptN+'잔','#2E7D32',1.2);
        FX.sparkle(m.x,m.y); FX.popText(m.x,m.y-36,'💪 체력+10 공격+5',{color:'#2E7D32',size:16});
        play('gulp');
      }
    });
    // KC 글씨
    for(let i=kcs.length-1;i>=0;i--){
      const p=kcs[i]; p.life-=dt; p.rot+=dt*9;
      if(!p.tg||p.tg.hp<=0||p.tg.dead) p.tg=nearestEnemy(p);
      if(!p.tg||p.life<=0){ kcs.splice(i,1); continue; }
      const dx=p.tg.x-p.x, dy=p.tg.y-p.y, d=Math.hypot(dx,dy)||1;
      p.x+=dx/d*p.sp*dt; p.y+=dy/d*p.sp*dt;
      if(d<(p.tg.r||14)+12){
        const tg=p.tg; tg.hp-=p.dmg; tg.blink=0.15; knock(tg,p,300);

      }

    for(let i=esens.length-1;i>=0;i--){

      const dx=p.tg.x-p.x, dy=p.tg.y-p.y, d=Math.hypot(dx,dy)||1;
      p.x+=dx/d*p.sp*dt; p.y+=dy/d*p.sp*dt;

        const tg=p.tg; tg.hp-=p.dmg; tg.stun=Math.max(tg.stun||0,p.stunT); tg.vx=0; tg.vy=0; tg.blink=0.2;

  function arenaMapBounce(b){
    if(!b.c||b.dead||b.eaten||!Number.isFinite(b.r)) return false;
    const id=activeArenaMap();
    if(id!=='house'&&id!=='school'&&id!=='japan') return false;
    let hit=false;
    arenaMapObjects(id,arenaMapBounds()).forEach(function(o){
      if(!o.solid) return;
      let nx=b.x-Math.max(o.x,Math.min(o.x+o.w,b.x));
      let ny=b.y-Math.max(o.y,Math.min(o.y+o.h,b.y));
      let d=Math.hypot(nx,ny);
      if(d>=b.r) return;
      if(d>0.0001){
        nx/=d; ny/=d;
        b.x+=nx*(b.r-d+.05); b.y+=ny*(b.r-d+.05);
      }else{
        const sides=[
          {d:Math.abs(b.x-o.x),x:-1,y:0},
          {d:Math.abs(o.x+o.w-b.x),x:1,y:0},
          {d:Math.abs(b.y-o.y),x:0,y:-1},
          {d:Math.abs(o.y+o.h-b.y),x:0,y:1}
        ].sort(function(a,c){return a.d-c.d;});
        nx=sides[0].x; ny=sides[0].y;
        if(nx) b.x=nx<0?o.x-b.r-.05:o.x+o.w+b.r+.05;
        else b.y=ny<0?o.y-b.r-.05:o.y+o.h+b.r+.05;
      }
      const speed=(b.vx||0)*nx+(b.vy||0)*ny;
      if(speed<0){b.vx-=2*speed*nx;b.vy-=2*speed*ny;}
      hit=true;
    });
    if(hit&&state==='play'&&fightT-mapBounceAt>=TUNING.maps.bounceFeedbackEvery){
      mapBounceAt=fightT; play('ballBounce');
      FX.burst(b.x,b.y,{count:4,colors:['#E2BD81','#FFFFFF'],speed:2});
    }
    return hit;
  }

  function onsenReturn(f){
    const bounds=arenaMapBounds(),objects=arenaMapObjects(activeArenaMap(),bounds);
    const r=Math.max(1,f.r||1),gap=r+2;
    let best=null,bestD=Infinity;
    for(let iy=0;iy<=12;iy++){
      for(let ix=0;ix<=12;ix++){
        const x=bounds[0]+gap+ix*Math.max(0,bounds[2]-bounds[0]-2*gap)/12;
        const y=bounds[1]+gap+iy*Math.max(0,bounds[3]-bounds[1]-2*gap)/12;
        const blocked=objects.some(function(o){
          const nx=Math.max(o.x,Math.min(o.x+o.w,x));
          const ny=Math.max(o.y,Math.min(o.y+o.h,y));
          return Math.hypot(x-nx,y-ny)<gap;
        });
        const d=Math.hypot(x-f._onsen.x,y-f._onsen.y);
        if(!blocked&&d<bestD){best={x:x,y:y};bestD=d;}
      }
    }

  function bodyCollide(a,b){
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy), m=a.r+b.r;
    if(d<=0||d>=m) return false;
    const nx=dx/d, ny=dy/d, ov=(m-d)/2;
    a.x-=nx*ov; a.y-=ny*ov; b.x+=nx*ov; b.y+=ny*ov;
    const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rel<0){ a.vx+=rel*nx; a.vy+=rel*ny; b.vx-=rel*nx; b.vy-=rel*ny; play('ballBounce'); }
    return true;
  }
  function knock(target,from,power){
    if(target.c && target.c.sans) return; // 샌즈는 밀치기 무시
    if(target.hideT>0) return; // 은신 중엔 밀리지 않는다
    let dx=target.x-from.x, dy=target.y-from.y, d=Math.hypot(dx,dy)||1;
    if(!isFinite(dx)||!isFinite(dy)) return; // 잘못된 위치값으로 공이 사라지지 않게
    target.vx+=dx/d*power; target.vy+=dy/d*power;
    target._kT=0.6;
  }

  function finish(w,newly){
    state='dead'; overTimer=0.9; winner=w;
    (newly||[]).forEach(function(f){ FX.explode(f.x,f.y,{power:1.4}); });
    FX.shake({strength:10,duration:400});
    play('kill'); play('over');
    if(w){ FX.confetti({x:300,y:200}); haptic('success'); } else haptic('heavy');
    // 토너먼트: 이긴 쪽 진출(동시 K.O.면 무작위)

      if(series){
        series.game++;
        if(w){ const k=sKey(w); series.wins[k]=(series.wins[k]||0)+1; if(series.wins[k]>=series.need){ series.done=true; series.champ=k; } }
        if(!series.done) return;
      }

        // 3·4위전: 이긴 선수 3위, 진 선수 4위 (결승 진출자는 그대로)
        const wi=series?(series.champ==='s0'?0:1):(w?(w.rid===pick[1]?1:0):(Math.random()<0.5?0:1));
        const wid=pick[wi], lid=pick[1-wi];
        tour.lastScore=series?(series.n+'판 '+series.need+'선승 · '+sScore()):'';
        tour.lastW=wid; tour.tie=!series&&!w; tour.lastRep=false; tour.lastBronze=true;
        if(tour.out){ tour.out[wid]=(tour.out[wid]||tour.rno||1)+0.5; tour.outLb[wid]='3·4위전 승리'; tour.outLb[lid]='3·4위전 패배'; }
        tour.isBronze=false; tour.bronzeDone=true;
      } else if(tour.isRep){
        // 패자부활전 배틀로얄: 최후의 1인이 부활해 대기 선수와 진출전(전멸이면 무작위)
        const R=tour.repIds||pick;
        const wid=(w&&w.rid!=null)?w.rid:R[Math.floor(Math.random()*R.length)];
        tour.lastScore=''; tour.lastW=wid; tour.tie=!w; tour.lastRep=true;
        if(tour.repForWait) tour.repW=wid; else tour.next.push(wid);
        if(tour.out){ delete tour.out[wid]; delete tour.outLb[wid]; }
        tour.isRep=false; tour.repForWait=false;
      } else if(tour.isWaitM){
        // 진출전: 대기 선수 vs 패자부활전 승자 — 이긴 쪽만 다음 라운드
        const wi=series?(series.champ==='s0'?0:1):(w?(w.rid===pick[1]?1:0):(Math.random()<0.5?0:1));
        const wid=pick[wi], lid=pick[1-wi];
        tour.lastScore=series?(series.n+'판 '+series.need+'선승 · '+sScore()):'';
        tour.lastW=wid; tour.tie=!series&&!w; tour.lastRep=false; tour.next.push(wid);
        if(tour.out){ const rn=rCount(); let p=4; while(p<rn) p*=2;
          tour.out[lid]=tour.rno||1; tour.outLb[lid]=(p/2<=2?'결승':(p/2)+'강')+' 진출전 탈락'; }
        if(tour.losers.indexOf(lid)<0) tour.losers.push(lid);
        tour.wait=null; tour.repW=null; tour.isWaitM=false;
      } else {
        const wi=series?(series.champ==='s0'?0:1):(w?(w.rid===pick[1]?1:0):(Math.random()<0.5?0:1));
        const wid=pick[wi], lid=pick[1-wi];
        tour.lastScore=series?(series.n+'판 '+series.need+'선승 · '+sScore()):'';
        tour.lastW=wid; tour.tie=!series&&!w; tour.lastRep=false; tour.next.push(wid);
        if(tour.out){ const rn=tour.round.filter(function(x){ return x!=null; }).length; let p=4; while(p<rn) p*=2;
          tour.out[lid]=tour.rno||1; tour.outLb[lid]=rn<=2?'결승 준우승':p+'강 탈락'; }
        tour.losers.push(lid); tour.ri++;
      }
      tour.hasNext=tourAdvance();
    }
    // 4인 리그: 순위대로 진출·부활·우승 처리
    if(mode==='grp'&&qg&&qg.hasNext) qgDone();
    // 마라톤: 이긴 선수가 남아서 다음 무작위 도전자와 바로 붙는다
    if(mode==='mara'&&mara){
      if(series){
        series.game++;
        if(w){ const k=sKey(w); series.wins[k]=(series.wins[k]||0)+1; if(series.wins[k]>=series.need){ series.done=true; series.champ=k; } }
        if(!series.done) return;
      }
      const wi=series?(series.champ==='s0'?0:1):(w?(w.rid===pick[1]?1:0):(Math.random()<0.5?0:1));
      const wid=pick[wi];
      mara.lastScore=series?(series.n+'판 '+series.need+'선승 · '+sScore()):'';
      mara.streak=(wi===0&&mara.no>1)?mara.streak+1:1;
      if(mara.streak>mara.best){ mara.best=mara.streak; mara.bestId=wid; }
      mara.lastW=wid; mara.tie=!series&&!w; mara.no++;
      if(mara.q.length){ pick=[wid,mara.q.shift()]; mara.hasNext=true; }
      else { mara.hasNext=false; mara.champ=wid; }
    }
    // 몇 판 몇 선승: 승수 올리고, 아직 안 끝났으면 기록 보고는 미룬다
    if(series&&mode!=='tour'&&mode!=='mara'){
      series.game++;
      if(w){ const k=sKey(w); series.wins[k]=(series.wins[k]||0)+1; if(series.wins[k]>=series.need){ series.done=true; series.champ=k; } }
      if(!series.done) return;
    }
    if(reported) return;
    let label=null;
    const RN={shrink:'줄어드는 링',chaos:'변신 난투',onehp:'서든데스',flood:'홍수전',lottery:'능력뽑기',zombie:'좀비모드',bomb:'폭탄모드',duos:'듀오전',mutation:'돌연변이',custom:'커스텀',hproll:'체력룰렛',dmgroll:'데미지룰렛',chase:'술래잡기',killmorph:'능력변신'}[rule]||'배틀로얄';
    if(rule==='monster') label=w?'몬스터전 '+(w.team===0?'공격자 승리':'몬스터 승리'):'몬스터전 무승부';
    else if(rule==='chase') label=w?'술래잡기 '+(w.team===0?'술래 승리':'피하는 자 승리'):'술래잡기 무승부';
    else if(rule==='duos'||rule==='zombie') label=w?RN+' '+(w.team+1)+'팀 승리':RN+' 무승부';
    else if(rule==='wave') label=F.some(function(f){ return f._waveKing && f.dead; })?'웨이브 '+waveNo+' · 왕 격파! 클리어':F.some(function(f){ return f._waveKing; })?'웨이브 '+waveNo+' · 왕 도전 실패':'웨이브 '+waveNo+' · '+(w?w.name+' 진출':'무승부');
    else if(mode==='duel') label=w?w.name+' 승리':'무승부';
    else if(mode==='royale') label=w?w.name+' '+RN+' 우승':RN+' 무승부';
    else if(mode==='team') label=w?TEAM_NAME[w.team]+' 팀전 승리':'팀전 무승부';
    else if(mode==='tag') label=w?TEAM_NAME[w.team]+' 태그팀 승리':'태그팀 무승부';
    else if(mode==='boss') label=!w?'보스전 무승부':w.isBoss?w.name+' 보스 승리':'보스전 도전자 승리';
    else if(mode==='mara') label=(mara&&!mara.hasNext&&mara.champ!=null)?wName(mara.champ)+' 마라톤 '+mara.streak+'연승 완주':null;
    else if(mode==='grp') label=(qg&&!qg.hasNext&&qg.champ!=null)?wName(qg.champ)+' 4인 리그 우승':null;
    else if(tour && !tour.hasNext && tour.champ!=null) label=wName(tour.champ)+' 토너먼트 우승';
    if(series&&series.done&&mode!=='tour'&&mode!=='mara') label=((w&&sKey(w)===series.champ)?w.name:sName(series.champ))+' '+series.n+'판 '+series.need+'선승 우승';
    if(label){ reported=true;
      try{ if(window.tapit&&window.tapit.reportResult) window.tapit.reportResult(label); }catch(e){}
    }
  }

  function moveFighter(P,tgt,dt){
    P.cd-=dt; P.blink-=dt; P.cdHit-=dt; P.cdClash-=dt; if(P.spawnT>0) P.spawnT-=dt;
    if(P._dadHolding){
      const V=P._dadHolding;
      if(V.dead || V.hp<=0 || !V._dadPlay || V._dadPlay.owner!==P ||
         V._dadPlay.phase!=='hold' || P.eaten || P.hideT>0 || waterSafe(P)){
        if(V._dadPlay && V._dadPlay.owner===P && V._dadPlay.phase==='hold') delete V._dadPlay;
        delete P._dadHolding;
      }else{
        P.vx=0; P.vy=0;
        walls(P,false);
        return;
      }
    }
    if(P._dadPlay){
      const H=P._dadPlay, O=H.owner;
      if(P.eaten || P.hideT>0 || waterSafe(P) ||
         (H.phase==='hold' && (!O || O.dead || O.hp<=0 || O.eaten || O.hideT>0 || waterSafe(O)))){
        if(O && O._dadHolding===P) delete O._dadHolding;
        delete P._dadPlay;
      }else{
        H.elapsed+=dt;
        if(H.phase==='hold'){
          const a=H.angle+Math.sin(H.elapsed*9+H.elapsed*H.elapsed*12)*0.9;
          const reach=(O.r+P.r)*0.68;
          P.x=Math.max(AX0+P.r,Math.min(AX1-P.r,O.x+Math.cos(a)*reach));
          P.y=Math.max(AY0+P.r,Math.min(AY1-P.r,O.y+Math.sin(a)*reach));
          P.vx=0; P.vy=0;
          if(H.elapsed>=1){
            const edges=[
              {d:P.x-P.r-AX0,x:-1,y:0},
              {d:AX1-P.x-P.r,x:1,y:0},
              {d:P.y-P.r-AY0,x:0,y:-1},
              {d:AY1-P.y-P.r,x:0,y:1}
            ].sort(function(a,b){return a.d-b.d;});
            H.phase='throw'; H.elapsed=0;
            H.nx=edges[0].x; H.ny=edges[0].y;
            H.speed=650/CAM.s;
            delete O._dadHolding;
            P.vx=H.nx*H.speed; P.vy=H.ny*H.speed;
            play('dadPlayThrow');
            FX.popText(O.x,O.y-O.r-24,'슝!',{color:O.color,size:20});
          }
          return;
        }
        H.speed+=900/CAM.s*dt;
        P.vx=H.nx*H.speed; P.vy=H.ny*H.speed;
        P.x+=P.vx*dt; P.y+=P.vy*dt;
        const hit=P.x-P.r<=AX0 || P.x+P.r>=AX1 ||
          P.y-P.r<=AY0 || P.y+P.r>=AY1;
        walls(P,false);
        if(hit){
          delete P._dadPlay;
          bonusDamage(O,P,H.damage,'놀아주기',false);
          FX.burst(P.x,P.y,{count:10,colors:['#527A9E','#FFFFFF','#FFD67A'],speed:5});
          FX.popText(P.x,P.y-P.r-20,'벽 충돌!',{color:'#527A9E',size:20});
          play('dadPlayWall');
          P.vx*=0.35; P.vy*=0.35;
        }else if(H.elapsed>3){
          delete P._dadPlay;
        }
        return;
      }
    }
    const rush=P.extraGuest && P.extraGuest.config===P.c && P.extraGuest.trashRush;
    if(rush){
      if(P.eaten || P.hideT>0 || P.stun>0 || waterSafe(P) ||
         P.rsGather || P.r100T>0 || P.morphT>0 || P.dmT>0 ||
         P.wzT>0 || P.downT>0 || P.vsHold>0 || P.mgT>0 ||
         (rule==='chase'&&P.team!==0)){
        delete P.extraGuest.trashRush;
      }else{
        const step=Math.min(dt,rush.left);
        const x0=P.x,y0=P.y;
        P.vx=rush.vx; P.vy=rush.vy;
        P.x+=P.vx*step; P.y+=P.vy*step;
        walls(P,false);
        const hits=alive().filter(function(v){
          return v!==P && v.team!==P.team && bonusCanHit(v) &&
            (rule!=='chase'||chaseNear(P,v)) &&
            dSegPt(x0,y0,P.x,P.y,v.x,v.y)<=P.r+v.r;
        }).sort(function(a,b){
          return Math.hypot(a.x-x0,a.y-y0)-Math.hypot(b.x-x0,b.y-y0);
        });
        rush.left=Math.max(0,rush.left-step);
        if(hits.length){
          const v=hits[0];
          bonusDamage(P,v,rush.damage,'휠체어 돌진',false);
          FX.burst(v.x,v.y,{count:8,colors:['#EF999F','#FFFFFF','#6C7F91'],speed:4});
          play('trashRushHit');
          rush.left=0;
        }
        if(rush.left<=0 || P.x-P.r<=AX0 || P.x+P.r>=AX1 ||
           P.y-P.r<=AY0 || P.y+P.r>=AY1){
          delete P.extraGuest.trashRush;
          P.vx*=0.35; P.vy*=0.35;
        }
        return;
      }
    }
    const dx=tgt.x-P.x, dy=tgt.y-P.y, d=Math.hypot(dx,dy)||1;
    // 리센느 멤버: 합체 때 리센느 주위를 돌며 빨려 들어감
    if(P.rsGather){
      const O=P.owner; P.vx=0; P.vy=0; P.stun=0;
      if(!O||O.dead||O.hp<=0||!(O.r100T>0)){ P.rsGather=false; return; }
      const k=Math.max(0,Math.min(1,O.r100T/R100.r100.gather)); // 1 → 0
      P.gRot+=dt*(1.6+(1-k)*9);
      P.gOff*=Math.exp(-dt*3.5);
      const ring=O.r+P.r0*0.9+14, tgD=k>0.45?ring:ring*(k/0.45);
      P.gD+=(tgD-P.gD)*Math.min(1,dt*5);
      const a=P.rsIdx*1.2566+P.gRot+P.gOff;
      P.x=O.x+Math.cos(a)*P.gD; P.y=O.y+Math.sin(a)*P.gD;
      P.r=P.r0*(k>0.45?1:Math.max(0.2,k/0.45));
      P.gSp=(P.gSp||0)-dt; if(P.gSp<=0){ P.gSp=0.3; FX.sparkle(P.x,P.y); }
      return;
    }
    // 리센느: 멤버가 모이는 동안 제자리에서 빛나며 무적
    if(P.r100T>0){
      P.r100T-=dt; P.vx=0; P.vy=0; P.stun=0;
      P.invT=Math.max(P.invT||0,P.r100T+0.3);
      walls(P,false);
      P.gSp=(P.gSp||0)-dt;
      if(P.gSp<=0){ P.gSp=0.25; FX.burst(P.x+(Math.random()-0.5)*P.r*2.4,P.y+(Math.random()-0.5)*P.r*2.4,{count:4,colors:['#FF6FB5','#FFD1E6','#fff'],speed:3}); }
      if(P.r100T<=0) becomeR100(P);
      return;
    }
    // 잼민이 → 샌즈 변신 중: 제자리에서 덜덜
    if(P.morphT>0){
      P.morphT-=dt; P.vx=0; P.vy=0;
      walls(P,false);
      if(P.morphT<=0) becomeSans(P);
      return;
    }
    // 동훈 → 다이아 변신 연출 중: 제자리에서 빛나며 무적
    if(P.dmT>0){
      P.dmT-=dt; P.vx=0; P.vy=0;
      walls(P,false);
      P.dmSp=(P.dmSp||0)-dt;
      if(P.dmSp<=0){ P.dmSp=0.22; FX.sparkle(P.x+(Math.random()-0.5)*P.r*2.4,P.y+(Math.random()-0.5)*P.r*2.4); }
      if(P.dmT<=0) becomeDia(P);
      return;
    }
    // 우즈 → 아귀 변신 중: 제자리에서 물거품 속 무적
    if(P.wzT>0){
      P.wzT-=dt; P.vx=0; P.vy=0; P.stun=0;
      P.invT=Math.max(P.invT||0,P.wzT+0.05);
      walls(P,false);
      P.wzSp=(P.wzSp||0)-dt;
      if(P.wzSp<=0){ P.wzSp=0.2; FX.burst(P.x+(Math.random()-0.5)*P.r*2,P.y+(Math.random()-0.5)*P.r*2,{count:4,colors:['#BDE6FF','#fff'],speed:3}); }
      if(P.wzT<=0) becomeAngler(P);
      return;
    }
    // 김동희: 쓰러졌다가 부활 대기 중 (무적·정지)
    if(P.downT>0){
      P.downT-=dt; P.vx=0; P.vy=0; P.stun=0;
      P.invT=Math.max(P.invT||0,P.downT+0.05);
      walls(P,false);
      if(P.downT<=0){
        P.downT=0; P.hp=30; P.blink=0; P.poisonN=0;
        // 부활 후: 피해 1.2배 · 쿨타임 1.25배 증가
        P.plasmaCd=Math.min(P.plasmaCd,P.c.plasma.every*1.25);
        FX.popText(P.x,P.y-50,'부활! HP 30',{color:'#7B2FF7',size:22});
        FX.popText(P.x,P.y-76,'피해×1.2 · 쿨타임×1.25',{color:'#00B8D4',size:18});
        FX.sparkle(P.x,P.y);
        if(!P.vsUsed){ P.vsUsed=true; voidSlash(P); }
      }
      return;
    }
    // 김동희 공허참 시전 중: 제자리에서 무적
    if(P.vsHold>0){
      P.vsHold-=dt; P.vx=0; P.vy=0; P.stun=0;
      P.invT=Math.max(P.invT||0,P.vsHold);
      walls(P,false);
      if(P.vsHold<=0){ P.vx=dx/d*TUNING.minSpeed; P.vy=dy/d*TUNING.minSpeed; }
      return;
    }
    // 데카츠요이에게 뱉어져 날아가는 중
    if(P.flyT>0){ P.flyT-=dt; FX.trail(P.x,P.y); }
    // 모몽가 → 데카츠요이 변신 중: 제자리에서 덜덜
    if(P.mgT>0){
      P.mgT-=dt; P.vx=0; P.vy=0;
      walls(P,false);
      if(P.mgT<=0) becomeDeka(P);
      return;
    }
    // 스킬 중에는 제자리에 멈춰 푸덕푸덕
    if(P.skillHold>0){
      P.skillHold-=dt; P.vx=0; P.vy=0;
      const sk=P.c.skill;
      if(P.skillQ>0){
        P.skillT-=dt;
        if(P.skillT<=0){ fireWave(P); P.skillQ--; P.skillT=sk.gap; }
      }
      walls(P,false);
      if(P.skillHold<=0){ P.vx=dx/d*TUNING.minSpeed; P.vy=dy/d*TUNING.minSpeed; }
      return;
    }
    // 손바닥 스킬 후 3초 동안 못 움직임 (이 동안 쿨타임은 흐르지 않음)
    if(P.slapHold>0){
      P.slapHold-=dt; P.vx=0; P.vy=0;
      walls(P,false);
      if(P.slapHold<=0){ P.vx=dx/d*TUNING.minSpeed; P.vy=dy/d*TUNING.minSpeed; }
      return;
    }
    // 샌즈는 모든 군중제어(기절·밀치기·튕김·멈춤) 무시 — 상대를 쫓지 않고 혼자 느긋하게 돌아다님
    const isSans=!!(P.c && P.c.sans);
    if(isSans){
      if(!P.eaten) P.stun=0;
      if(!(P.dodgeT>0) && P.preVx!==undefined){
        // 피하기가 끝나면 원래 걷던 방향으로 복귀
        P.vx=P.preVx; P.vy=P.preVy; P.preVx=undefined; P.preVy=undefined;
      }
      if(!(P.dodgeT>0) && !(P.flyT>0) && !P.eaten){
        const sp=Math.hypot(P.vx,P.vy);
        let a=sp>1?Math.atan2(P.vy,P.vx):Math.random()*6.283;
        if(P.wTurn===undefined || Math.random()<dt*0.8) P.wTurn=(Math.random()*2-1)*1.6;
        a+=P.wTurn*dt;
        const ws=110;
        P.vx=Math.cos(a)*ws; P.vy=Math.sin(a)*ws;
      }
    }
    // L 맞고 기절: 못 움직임
    if(P.stun>0){
      P.stun-=dt; P.vx=0; P.vy=0;
      walls(P,false);
      if(P.stun<=0){ P.vx=dx/d*TUNING.minSpeed; P.vy=dy/d*TUNING.minSpeed; }
      return;
    }
    // 원숭이두창에 맞으면 움직임만 멈춤(공격은 계속)
    if(P.mpT>0){ P.mpT-=dt; P.vx=0; P.vy=0; }
    else if(!isSans && !(P.flyT>0)){
      const moveMul=P.c.bonusKind==='koala'?TUNING.koalaBee.speedByStage[P.koalaStage||0]:1;
      const cruise=TUNING.cruise*moveMul, minSpeed=TUNING.minSpeed*moveMul;
      P.vx+=dx/d*TUNING.homing*moveMul*dt; P.vy+=dy/d*TUNING.homing*moveMul*dt;
      let sp=Math.hypot(P.vx,P.vy);
      if(sp>cruise){ const ns=Math.max(cruise, sp*Math.exp(-TUNING.friction*dt)); P.vx*=ns/sp; P.vy*=ns/sp; }
      else if(sp<minSpeed){ const ns=Math.min(minSpeed, sp+200*moveMul*dt)||minSpeed;
        if(sp<1){P.vx=0;P.vy=-ns;} else {P.vx*=ns/sp;P.vy*=ns/sp;} }
    }
    const movementMap=activeArenaMap();
    const mapMoveMul=movementMap==='space'?(P.c.name==='어둠속성 김켈리'?1:TUNING.maps.seaSpaceMoveMul):movementMap==='sea'?(P.c.angler||P.c.waterAwaken||P.c.name==='부캉이'?TUNING.maps.seaSpaceFishMoveMul:TUNING.maps.seaSpaceMoveMul):1;
    P.x+=P.vx*dt*mapMoveMul; P.y+=P.vy*dt*mapMoveMul; P.ang+=P.spin*dt;
    const wHit=P.x-P.r<AX0||P.x+P.r>AX1||P.y-P.r<AY0||P.y+P.r>AY1;
    walls(P,true);
    // 뱉어진 상대: 벽에 부딪힐 때마다 추가 피해
    if(wHit && P.flyT>0 && (P.wallN||0)<DEKA.deka.wallMax){
      const wd=DEKA.deka.wallDmg; P.wallN=(P.wallN||0)+1;
      P.missStill=true; P.hp-=wd; P.blink=0.15;
      FX.burst(P.x,P.y,{count:12,colors:['#D8E83A','#fff','#1E1B2E'],speed:6});
      FX.popText(P.x,P.y-34,'벽꿍! -'+wd,{color:'#6B7A00',size:22});
      play('hit');
    }
    if(P.c.prank){
      const pk=P.c.prank;
      P.prankCd=Math.max(0,(P.prankCd===undefined?pk.every:P.prankCd)-dt);
      P.troubleCd=Math.max(0,(P.troubleCd===undefined?pk.troubleEvery:P.troubleCd)-dt);
      if(P.prankCd<=0 && bonusCanHit(tgt) && Math.hypot(tgt.x-P.x,tgt.y-P.y)<=P.r+tgt.r+pk.range*bossR(P)){
        P.prankCd=pk.every;
        shout(P,'장난이야!',P.color,1);
        if(bonusDamage(P,tgt,pk.damage,'장난기',false)){
          tgt.stun=Math.max(tgt.stun||0,pk.stun);
        }
      }
      if(P.troubleCd<=0){
        const targets=F.concat(minions).filter(function(v){
          return v!==P && v.team!==P.team && bonusCanHit(v) &&
            Math.hypot(v.x-P.x,v.y-P.y)<=P.r+v.r+pk.troubleRange*bossR(P);
        });
        if(targets.length){
          P.troubleCd=pk.troubleEvery;
          shout(P,'말썽 피우기!',P.color,1);
          play('whoosh');
          FX.burst(P.x,P.y,{count:14,colors:['#8CC63F','#FFD65A','#ffffff'],speed:5});
          targets.forEach(function(v){
            const troubleDamage=pk.troubleDamage+(Math.random()<pk.troubleBonusChance?pk.troubleBonusDamage:0);
            if(bonusDamage(P,v,troubleDamage,'말썽 피우기',false)){
              const a=Math.atan2(v.y-P.y,v.x-P.x);
              v.vx+=Math.cos(a)*pk.knock;
              v.vy+=Math.sin(a)*pk.knock;
            }
          });
        }
      }
    }
    // 스킬: 물뿜기
    if(P.c.skill){
      const sk=P.c.skill;
      if(P.skillQ>0){
        P.skillT-=dt;
        if(P.skillT<=0){ fireWave(P); P.skillQ--; P.skillT=sk.gap; }
      } else {
        P.skillCd-=dt;
        if(P.skillCd<=0){ P.skillCd=sk.every; P.skillQ=sk.hits.length; P.skillT=0; P.skillIdx=0;
          P.skillHold=(sk.hits.length-1)*sk.gap+(sk.range*bossR(P)-P.r)/sk.speed+0.15; P.vx=0; P.vy=0; }
      }
    }
    // 스킬: 거대 손바닥
    if(P.c.slap && !slaps.some(function(s){ return s.o===P; })){
      const SL0=P.c.slap, rage=SL0.rage && P.hp<=P.maxHp*0.5;
      if(rage){
        // 복서 모드: 체력 절반 이하 — 빠른 연속 펀치, 가까이 붙어야만 발동
        const RG=SL0.rage;
        if(!P.boxer){
          P.boxer=true;
          shout(P,'야 내가 봐주니까 좋냐?','#E0457B',3);
          FX.flash({color:'#FFC0D3',alpha:0.35});
          FX.burst(P.x,P.y,{count:20,colors:['#E0457B','#FF1744','#fff'],speed:7});
          FX.popText(P.x,P.y-50,'🥊 복서모드 🥊',{color:'#E0457B',size:22});
        }
        if(P.slapCd>RG.every) P.slapCd=RG.every;
        P.slapCd-=dt;
        const gap=Math.hypot(tgt.x-P.x,tgt.y-P.y)-P.r-tgt.r;
        if(P.slapCd<=0 && gap<=RG.near*bossR(P)){
          P.slapCd=RG.every;
          slaps.push({o:P,tg:tgt,t:0,hit:false,lx:tgt.x,ly:tgt.y,sl:RG,rage:true});
          play('whoosh');
        }
      } else {
        P.slapCd-=dt;
        if(P.slapCd<=0){
          P.slapCd=SL0.every;
          P.slapHold=SL0.stun||0; P.vx=0; P.vy=0;
          slaps.push({o:P,tg:tgt,t:0,hit:false,lx:tgt.x,ly:tgt.y});
          play('whoosh');
        }
      }
    }
    // 마이린: 엄마의 펀치
    if(P.c.punch){
      // 엄마가 때리는 동안 마이린은 제자리에서 라면 먹으며 관전
      if(punches.some(function(p){ return p.o===P; })){ P.x-=P.vx*dt; P.y-=P.vy*dt; P.vx=0; P.vy=0; }
      P.punchCd-=dt;
      if(P.punchCd<=0 && !punches.some(function(p){ return p.o===P; })){
        P.punchCd=P.c.punch.every;
        punches.push({o:P,tg:tgt,t:0,hit:false,lx:tgt.x,ly:tgt.y});
        play('whoosh');
      }
    }
    // 권루트 스킬
    if(P.c.root){
      const R=P.c.root;
      // 셀카봉을 휘두르는 동안은 쿨타임이 줄지 않는다
      const selfieOn=sticks.some(function(s){ return s.o===P; });
      if(!selfieOn){ P.rootCd-=dt; if(P.rootCd<=0){ P.rootCd=R.every; rootSkill(P,tgt); } }
    }
    // 김재원 버섯 스킬
    if(P.c.jae){
      P.jaeCd-=dt;
      if(P.jaeCd<=0){ P.jaeCd=P.c.jae.every; jaeSkill(P,tgt); }
    }
    // 잼민이 소고기 던지기
    if(P.c.jam){
      P.jamCd-=dt;
      if(P.jamCd<=0){ P.jamCd=P.c.jam.every; jamSkill(P,tgt); }
    }
    // 샌즈 가스터 블래스터
    if(P.c.sans){
      P.sansCd-=dt;
      if(P.sansCd<=0){ P.sansCd=P.c.sans.every; sansSkill(P,tgt); }
    }
    // 서준이 제로산소: 불 때마다 초당 피해 +1
    if(P.c.o2){
      P.o2Cd-=dt;
      if(P.o2Cd<=0){ P.o2Cd=P.c.o2.every; o2Skill(P); }
    }
    // 해봄: 박자박사 소환 → 10초마다 진화 (3단계까지)
    if(P.c.haebom && P.hbLv<3){
      P.hbCd-=dt;
      if(P.hbCd<=0){ P.hbCd=P.c.haebom.every; haebomSkill(P); }
    }
    // 리센느: 7초마다 멤버 소환 → 5명 다 모이면 리센느 100%
    if(P.c.rescene){
      if(P.rsCd===undefined) P.rsCd=P.c.rescene.every;
      P.rsCd-=dt; if(P.rsCd<=0){ P.rsCd=P.c.rescene.every; resceneSkill(P); }
    }
    // 리센느 100%: 7초마다 화장품 투척
    if(P.c.r100){
      if(P.cosCd===undefined) P.cosCd=P.c.r100.every;
      P.cosCd-=dt;
      if(P.cosCd<=0){ P.cosCd=P.c.r100.every; cosmThrow(P,tgt); }
    }
    // 최강록: 5.5초마다 링 전체 조림 (맞은 상대는 영구히 받는 피해 2배)
    if(P.c.jorim){
      if(P.jrCd===undefined) P.jrCd=P.c.jorim.every;
      P.jrCd-=dt; if(P.jrCd<=0){ P.jrCd=P.c.jorim.every; jorimSkill(P); }
    }
    // 마동석: 30초가 지나면 상대를 진실의 방으로 (한 경기 한 번)
    if(P.c.ma && !P.maUsed && !truth){
      if(P.maT===undefined) P.maT=P.c.ma.wait;
      P.maT=Math.max(0,P.maT-dt);
      if(P.maT<=0 && tgt && F.indexOf(tgt)>=0 && tgt.team!==P.team && !tgt.dead && tgt.hp>0 && !(tgt.hideT>0) && !tgt.eaten && !waterSafe(tgt)){
        P.maUsed=true; startTruth(P,tgt);
      }
    }
    // 히든 백수저 최강록: 1.5초마다 링 곳곳에 들기름
    if(P.c.baek){
      if(P.oilCd===undefined) P.oilCd=P.c.baek.every;
      P.oilCd-=dt; if(P.oilCd<=0){ P.oilCd=P.c.baek.every; spawnOil(P); }
    }
    // 동훈: 3초마다 돈 뿌리기, 5초마다 다이아 하나씩 (10개면 변신)
    if(P.c.dh){
      const D=P.c.dh;
      P.dhCd-=dt;
      if(P.dhCd<=0){ P.dhCd=D.every; dhSkill(P,tgt); }
      P.gemCd-=dt;
      if(P.gemCd<=0){
        P.gemCd=D.gemEvery; P.gemN++;
        FX.sparkle(P.x,P.y);
        FX.popText(P.x,P.y-40,'💎 '+P.gemN+'/'+D.gems,{color:'#1E88E5',size:18});
        play('gem');
        if(P.gemN>=D.gems) startDiaMorph(P);
      }
    }
    // 다이아 동훈: 변신 직후 잠시 무적
    if(P.invT>0) P.invT=Math.max(0,P.invT-dt);
    // 다이아 동훈: 10초마다 다이아 크래시
    if(P.c.dia && !dias.some(function(s){ return s.o===P; })){
      P.diaCd-=dt;
      if(P.diaCd<=0){ P.diaCd=P.c.dia.every; diaSkill(P,tgt); }
    }
    // 지옥참마도: 5초마다 패리 자세(1.5초)
    if(P.c.hell){
      const HL=P.c.hell;
      if(P.parryT>0) P.parryT=Math.max(0,P.parryT-dt);
      P.hellCd-=dt;
      if(P.hellCd<=0){
        P.hellCd=HL.every; P.parryT=HL.parry; P.parryHit=[];
        shout(P,'울어라. 지옥참마도!','#8E1B2B',1.5);
        FX.sparkle(P.x,P.y); play('clash');
      }
    }
    // 참마도의 혼: 7초마다 링 전체 검기
    if(P.c.ghost && !kgs.some(function(s){ return s.o===P; })){
      P.ghostCd-=dt;
      if(P.ghostCd<=0){ P.ghostCd=P.c.ghost.every; ghostSkill(P); }
    }
    // 모노크롬: 3초마다 잉크 → 그 자리로 순간이동
    if(P.c.mono){
      P.monoCd-=dt;
      if(P.monoCd<=0){ P.monoCd=P.c.mono.every; if(!inks.some(function(s){ return s.o===P; })) monoSkill(P); }
    }
    // 우즈: 4.5초마다 노래 → 링에 물이 차오름
    if(P.c.woodz){
      if(P.wzCd===undefined) P.wzCd=P.c.woodz.every;
      P.wzCd-=dt;
      if(P.wzCd<=0){ P.wzCd=P.c.woodz.every; woodzSing(P); if(P.wzT>0) return; }
    }
    // 나우아임영: 10초마다 룰렛
    if(P.c.nay){
      if(P.nayCd===undefined) P.nayCd=P.c.nay.first;
      if(P.nayRoll>0){
        // 룰렛이 도는 중 → 멈추면 결과 발동
        P.nayRoll-=dt;
        if(P.nayRoll<=0){ P.nayRoll=0; nayRoulette(P,nearestEnemy(P)||tgt,P.nayR); }
      } else {
        P.nayCd-=dt;
        if(P.nayCd<=0){ P.nayCd=P.c.nay.every; nayStartRoll(P); }
      }
    }
    // 아귀: 5초마다 상대를 물고 체력 회복
    if(P.c.angler){
      P.anglerCd-=dt;
      if(P.anglerCd<=0){ P.anglerCd=P.c.angler.every; anglerBite(P,tgt); }
      // 물이 꽉 찬 동안 상대는 초당 2 피해(방어 무시)
      P.drownTick=(P.drownTick===undefined?1:P.drownTick)-dt;
      if(P.drownTick<=0){
        P.drownTick+=1;
        alive().forEach(function(e){
          if(e===P||e.team===P.team||e.hp<=0||e.isDoc||e.eaten) return;
          const dd=2*bossHitMul(P,e);
          e._drown=(e._drown||0)+dd;
          FX.popText(e.x,e.y-30,'🌊 -'+dd,{color:'#1B6FB0',size:16});
        });
      }
    }
    // 솧툌춋: 6초마다 무작위 4곳 지그재그 플라즈마 커터
    if(P.c.plasma){
      P.plasmaCd-=dt;
      if(P.plasmaCd<=0){ P.plasmaCd=P.c.plasma.every*(P.lastStand?1.25:1); if(!pcs.some(function(s){ return s.o===P; })) plasmaSkill(P); }
    }
    // 모몽가: 하늘색 꼬리가 빙글빙글 — 닿으면 밀쳐내기(쿨타임 없음)
    if(P.c.momo) momoTail(P,dt);
    // 아이찡: 🤨 이모지 꼬리 — 닿을수록 길어지고 늘어남(쿨타임 없음)
    if(P.c.aiz) aizTail(P,dt);
    // 데카츠요이: 붙어 있는 상대를 먹고 뱉기
    if(P.c.deka && !swal.some(function(s){ return s.o===P; })){
      const DK=P.c.deka;
      P.dekaCd=(P.dekaCd||0)-dt;
      if(P.dekaCd<=0){
        let v=null, bd=1e9;
        F.forEach(function(e){
          if(e===P||e.dead||e.team===P.team||e.hp<=0||e.eaten||e.morphT>0||e.dmT>0||e.mgT>0||e.invT>0) return;
          const gp=Math.hypot(e.x-P.x,e.y-P.y)-P.r-e.r;
          if(gp<=DK.reach*bossR(P) && gp<bd){ bd=gp; v=e; }
        });
        if(v){ P.dekaCd=DK.every; dekaEat(P,v); }
      }
    }
  }

  // ===== 모몽가: 꼬리 밀치기 → 쓰러지면 데카츠요이 =====
  function momoTail(P,dt){
    const M=P.c.momo, k=bossR(P), L=M.len*k, hw=M.width*k*0.5;
    P.tailA=(P.tailA||0)+M.spin*dt;
    const c=Math.cos(P.tailA), s=Math.sin(P.tailA);
    const ax=P.x+c*P.r*0.5, ay=P.y+s*P.r*0.5, ex=P.x+c*(P.r+L), ey=P.y+s*(P.r+L);
    if(!P.tailCds) P.tailCds=[];
    P.tailCds=P.tailCds.filter(function(q){ q.t-=dt; return q.t>0; });
    alive().forEach(function(e){
      if(e===P||e.team===P.team||e.hp<=0||e.isDoc||e.eaten) return;
      if(P.tailCds.some(function(q){ return q.e===e; })) return;
      if(dSegPt(ax,ay,ex,ey,e.x,e.y)<(e.r||14)+hw){
        P.tailCds.push({e:e,t:M.hitGap});
        e.hp-=M.dmg; e.blink=0.15; knock(e,P,M.knock);
        FX.burst(e.x,e.y,{count:10,colors:['#AEDDF7','#ffffff','#6FB6E3'],speed:6});
        FX.popText(e.x,e.y-32,'-'+M.dmg,{color:'#2F86C0',size:22});
        play('tail');
      }
    });
  }
  // ===== 아이찡: 🤨 이모지 꼬리 =====
  function aizTail(P,dt){
    const A=P.c.aiz, k=bossR(P), sg=A.seg*k;
    if(!P.aizT){
      P.aizT=[{n:A.start}]; P.aizHits=0;
      shout(P,'이거 제 이모지야','#E08A00',1.6);
      FX.popText(P.x,P.y-50,'🤨',{size:30});
    }
    // 체력 100 이하: 😡 분노 — 꼬리 10개 추가(데미지 +20)
    if(!P.aizRage && P.hp>0 && P.hp<=100){
      P.aizRage=true;
      P.aizT[0].n+=10;
      shout(P,'이거 제 이모지야!!','#E53935',1.6);
      FX.flash({color:'#FF3B30',alpha:0.3});
      FX.burst(P.x,P.y,{count:24,colors:['#FF3B30','#FFC83D','#ffffff'],speed:8});
      FX.popText(P.x,P.y-60,'😡 꼬리 +10 · 데미지 +20',{color:'#E53935',size:20});
    }
    if(!P.aizCds) P.aizCds=[];
    P.aizCds=P.aizCds.filter(function(q){ q.t-=dt; return q.t>0; });
    // 꼬리 마디가 아이찡이 지나간 길을 따라 졸졸 따라온다
    if(!P.aizPts) P.aizPts=[];
    const tl0=P.aizT[0], gap0=P.r+sg*0.35, gap=sg*0.85;
    while(P.aizPts.length<tl0.n){
      const vl=Math.hypot(P.vx||0,P.vy||0)||1, last=P.aizPts.length?P.aizPts[P.aizPts.length-1]:{x:P.x,y:P.y};
      const gg=P.aizPts.length?gap:gap0;
      P.aizPts.push({x:last.x-(P.vx||0)/vl*gg, y:last.y-(P.vy||1)/vl*gg});
    }
    if(P.aizPts.length>tl0.n) P.aizPts.length=tl0.n;
    let fx=P.x, fy=P.y;
    P.aizPts.forEach(function(pt,j){

  // ===== 지옥참마도: 패리 → 상대 뒤로 순간이동 베기 / 쓰러지면 참마도의 혼 =====
  function parryCounter(P,dt){
    // 패리 중 때린 상대를 대기열에 쌓는다
    if(P.counterTg){
      if(!P.slashQ) P.slashQ=[];
      P.counterTg.forEach(function(t){ if(t && P.slashQ.indexOf(t)<0) P.slashQ.push(t); });
      P.counterTg=null;
    }
    // 한 명 베기가 끝날 때까지 기다린다
    if(P.slashT>0){ P.slashT-=dt; if(P.slashT>0) return; }
    const q=P.slashQ;
    if(!q||!q.length){ P.slashN=0; return; }
    if(P.dead||!P.c.hell){ P.slashQ=[]; P.slashN=0; return; }
    let tg=null;
    while(q.length && !tg){ const t=q.shift(); if(t && t.hp>0 && !t.dead) tg=t; }
    if(!tg){ P.slashN=0; return; }
    const HL=P.c.hell;
    // 한 명 뒤로 순간이동해 베고, 끝나면 다음 사람
    let dx=tg.x-P.x, dy=tg.y-P.y; const d=Math.hypot(dx,dy)||1; dx/=d; dy/=d;
    const fx=P.x, fy=P.y, gap=tg.r+P.r+6;
    P.x=Math.max(AX0+P.r,Math.min(AX1-P.r,tg.x+dx*gap));
    P.y=Math.max(AY0+P.r,Math.min(AY1-P.r,tg.y+dy*gap));
    P.vx=0; P.vy=0;

  function updateTruth(dt){

  function updateJorim(dt){
    const B=BAEK.baek;
    for(let i=oils.length-1;i>=0;i--){
      const o=oils[i]; o.t+=dt; o.life-=dt;
      if(o.life<=0||o.o.dead||o.o.c!==BAEK||F.indexOf(o.o)<0){ oils.splice(i,1); continue; }
      if(o.t<0.35) continue; // 떨어지는 중
      let used=false;
      for(const f of F){
        if(f.dead||f.hp<=0||f.eaten||f.hideT>0) continue;
        if(Math.hypot(f.x-o.x,f.y-o.y)>f.r*0.7+o.r) continue;
        if(f.team===o.team){
          // 아군(자신 포함): 3초 이속 1.5배 + 쿨타임 4초 감소
          f.oilBoostT=B.boost;
          RS_CDK.forEach(function(k){ const v=f[k]; if(typeof v==='number'&&v>0) f[k]=Math.max(0.01,v-B.cdCut); });
          FX.sparkle(f.x,f.y);
          FX.popText(f.x,f.y-40,'💨 들기름 버프! 쿨타임 -'+B.cdCut+'초',{color:'#B8860B',size:16});
          play('gem');
        } else {
          // 적: 30 피해 + 2초 슬로우 + 영구 화상
          const dbl=!!f.braised; // 조려진 상대에겐 들기름도 2배
          const d=Math.round(B.dmg*bossHitMul(o.o,f)*(dbl?2:1));
          if(f.c&&f.c.sans) f.missStill=true;
          f.hp-=d; f.blink=0.2; f.slowT=Math.max(f.slowT||0,B.slow); f.burnT=1e9; f.noDbl=(f.noDbl||0)+d;
          FX.burst(f.x,f.y,{count:14,colors:['#E8B32E','#FFF1B8','#FF7A1A'],speed:6});
          FX.popText(f.x,f.y-34,(dbl?'×2 ':'')+'-'+d,{color:dbl?'#E53935':'#B8860B',size:24});
          FX.popText(f.x,f.y-60,'🫗 미끌! 🐢 🔥',{color:'#A0522D',size:16});
          play('hit');
        }
        used=true; break;
      }
      if(used) oils.splice(i,1);
    }
    F.forEach(function(f){
      if(f.baekT>0){
        // 변신 중엔 제자리에서 움직이지 않는다
        if(f.baekX!==undefined){ f.x=f.baekX; f.y=f.baekY; } f.vx=0; f.vy=0;
        const was=f.baekT; f.baekT=Math.max(0,f.baekT-dt); if(was>0.55&&f.baekT<=0.55&&!f.dead) baekAppear(f);
      }
    });
    for(let i=jfx.length-1;i>=0;i--){ jfx[i].t+=dt; if(jfx[i].t>1.2) jfx.splice(i,1); }
    F.forEach(function(f){
      if(f.dead||!(f.oilBoostT>0)) return;
      f.oilBoostT-=dt; f.x+=f.vx*dt*0.5; f.y+=f.vy*dt*0.5; walls(f,false);
    });
  }
  const RS_CDK=['cd','rootCd','jaeCd','jamCd','sansCd','skillCd','slapCd','punchCd','o2Cd','hbCd','dhCd','gemCd','diaCd','hellCd','ghostCd','monoCd','plasmaCd','wzCd','nayCd','anglerCd','dekaCd','rsCd','cosCd','jrCd','oilCd'];
  function updateRescene(dt){

      const dx=p.tg.x-p.x, dy=p.tg.y-p.y, d=Math.hypot(dx,dy)||1;

        else {

          const O=p.o;

    F.forEach(function(f){

      if(f.slowT>0){ f.slowT-=dt; f.x-=f.vx*dt*0.5; f.y-=f.vy*dt*0.5; walls(f,false); }
      if(f.burnT>0) f.burnT-=dt;

          if(typeof pv[k]==='number' && v<pv[k] && pv[k]-v<0.2) f[k]=v+(pv[k]-v)*0.5; });
        const np={}; RS_CDK.forEach(function(k){ if(typeof f[k]==='number') np[k]=f[k]; }); f._pv=np;
      } else f._pv=null;
    });
  }

  function nearestEnemy(e){
    let best=null, bd=1e9, hb=null, hd=1e9;
    // 무적 박자박사는 노리지 않는다(해봄을 노림) · 은신한 상대는 다른 상대가 없을 때만
    alive().forEach(function(o){ if(o.team===e.team||o.hp<=0||o.isDoc) return; const d=Math.hypot(o.x-e.x,o.y-e.y);
      if(o.hideT>0){ if(d<hd){ hd=d; hb=o; } return; }
      if(d<bd){ bd=d; best=o; } });
    // 은신한 상대는 아무도 눈치채지 못한다
    return best;
  }

  // 변신 중 무적 / 샌즈 12번 회피 / 잼민이 쓰러지면 변신
  function guardHp(){
    F.forEach(function(f){
      if(f.dead) return;
      if(f.hp0===undefined){
        if(f.c.bonusKind==='koala') deathMorph(f);
        return;
      }
      if(f._candyKo){ f.hp=f.hp0=0; return; }
      // 해봄 보호막이 먼저 피해를 막는다
      if(f.shield>0 && f.hp<f.hp0){ const ab=Math.min(f.shield,f.hp0-f.hp); f.hp+=ab; f.shield-=ab; }
      // 지옥참마도 패리: 맞는 순간 막고, 다음 순간 상대 뒤로 이동해 벤다
      if(f.c.hell && f.parryT>0 && f.hp<f.hp0){
        // 패리는 1.5초 동안 계속 유지 — 그동안 때린 상대는 전부 베기 대상
        f.hp=f.hp0; f.blink=0; f.stun=0; f.poisonN=0;
        if(!f.parryHit) f.parryHit=[];
        const near=alive().filter(function(e){
          if(e===f||e.team===f.team||e.hp<=0||e.isDoc||f.parryHit.indexOf(e)>=0) return false;
          return Math.hypot(e.x-f.x,e.y-f.y)<f.r+(e.r||14)+90;
        });
        if(!near.length){ const ne=nearestEnemy(f); if(ne && f.parryHit.indexOf(ne)<0) near.push(ne); }
        if(near.length){
          near.forEach(function(e){ f.parryHit.push(e); });
          f.counterTg=(f.counterTg||[]).concat(near);
          FX.popText(f.x,f.y-36,'패리!',{color:'#8E1B2B',size:22});
          FX.burst(f.x,f.y,{count:10,colors:['#FFD54F','#fff'],speed:5});
          play('clash');
        }
        return;
      }
      if(f.morphT>0){ if(f.hp<f.hp0){ f.hp=f.hp0; f.blink=0; f.stun=0; f.poisonN=0; } return; }
      if(f.invT>0 || f.dmT>0){ if(f.hp<f.hp0){ f.hp=f.hp0; f.blink=0; f.stun=0; f.poisonN=0; } return; }
      if(f.c.sans && f.hp<f.hp0 && f.dodges<sansDodgeMax(f)){
        f.hp=f.hp0; f.dodges++; f.stun=0; f.poisonN=0; f.blink=0;
        const still=!!f.missStill; f.missStill=false;
        // 폭발 같은 범위 공격은 제자리 MISS — 밀려나지 않음
        if(!still){
          // 옆으로 휙 피하기: 공격한 상대 방향의 수직 방향으로 순간 이동하듯 비켜섬
          if(!(f.dodgeT>0)){ f.preVx=f.vx; f.preVy=f.vy; }
          f.dodgeT=0.28;
          const en=nearestEnemy(f);
          let hx=en?f.x-en.x:f.vx, hy=en?f.y-en.y:f.vy;
          const hd=Math.hypot(hx,hy)||1; hx/=hd; hy/=hd;
          const a=Math.random()<0.5?1:-1;
          f.vx=-hy*a*480; f.vy=hx*a*480;
        }
        FX.burst(f.x,f.y,{count:8,colors:['#5AB9FF','#ffffff'],speed:4});
        shouts=shouts.filter(function(s){ return !(s.o===f && s.text==='윽!'); });
        FX.popText(f.x,f.y-36,'MISS',{color:'#8a8a8a',size:22});
        play('dodge');
        return;
      }
      deathMorph(f);
    });
  }
  // 쓰러지면 변신·부활하는 캐릭터 처리 (막을 수 없는 물 피해 뒤에도 다시 확인)
  function installLetterDefense(f){
    if(f._letterGuardInstalled) return;
    f._letterGuardInstalled=true;
    const descriptor=Object.getOwnPropertyDescriptor(f,'hp');
    let hp=f.hp;
    Object.defineProperty(f,'hp',{
      enumerable:true,configurable:true,
      get:function(){return descriptor&&descriptor.get?descriptor.get.call(f):hp;},
      set:function(value){
        const before=descriptor&&descriptor.get?descriptor.get.call(f):hp;
        if(state==='play' && !f.dead && !f._letterChanging && !f._candyKo &&
          f.c.bonusKind==='hhh' && f.c.letterStage===1 && f._letterBlocks>0 &&
          Number.isFinite(value) && value<before){
          f._letterBlocks--;
          FX.burst(f.x,f.y,{count:7,colors:['#FFE52A','#FFFFFF'],speed:3});
          FX.popText(f.x,f.y-36,'방어! '+f._letterBlocks+'대 남음',{color:'#A48C00',size:17});
          play('clash');
          return;
        }
        if(descriptor&&descriptor.set) descriptor.set.call(f,value);
        else hp=value;
      }
    });
  }
  function evolveLetterForm(f){
    if(f.c.bonusKind!=='hhh' || f.eaten || !customCanEvolve(f)) return false;
    const H=TUNING.guests.hhh, stage=f.c.letterStage||0;
    if(stage>=2 || f.hp>(stage===0?H.mAt:H.rAt)) return false;
    const next=stage+1;
    const hpMul=mode==='boss'&&f.isBoss?(f.bossMul||1):1;
    const name=next===1?'MMM':'RRR';

  function koalaWatchAttackSource(o){
    if(!o || typeof o!=='object') return null;
    let book=koalaAttackBooks.get(o);
    if(!book || book.config!==o.c){
      book={config:o.c,channels:new Map(),labels:new Map(),watched:new WeakMap(),latest:null};
      koalaAttackBooks.set(o,book);
    }
    function watch(holder,key,channel){
      if(!holder || typeof holder!=='object') return;
      const d=Object.getOwnPropertyDescriptor(holder,key);
      if(!d || !d.configurable || !Object.prototype.hasOwnProperty.call(d,'value') ||
        !d.writable || typeof d.value!=='number') return;
      let keys=book.watched.get(holder);
      if(!keys){ keys=new Set();book.watched.set(holder,keys); }
      if(keys.has(key)) return;
      keys.add(key);
      let value=d.value;
      if(!book.channels.has(channel)) book.channels.set(channel,{});
      if(book.latest===null) book.latest=channel;
      Object.defineProperty(holder,key,{
        enumerable:d.enumerable,configurable:true,
        get:function(){return value;},
        set:function(next){
          const previous=value;
          value=next;
          if(Number.isFinite(next) && next>0 && next>previous){
            book.channels.set(channel,{});
            book.latest=channel;
            previewSecretAbilityUsed(o,channel);
          }
        }
      });
    }
    Object.keys(o).forEach(function(key){
      if(/Cd$/.test(key)||key==='cd') watch(o,key,key);
    });
    [
      ['bonus:',o.bonusCds],
      ['guest:',o.guest&&o.guest.cds],
      ['extra:',o.extraGuest&&o.extraGuest.cds]
    ].forEach(function(row){
      if(!row[1]) return;
      Object.keys(row[1]).forEach(function(key){
        if(key!=='combo') watch(row[1],key,row[0]+key);
      });
    });
    if(!book.channels.size){
      book.channels.set('attack',{});
      book.latest='attack';
    }
    return book;
  }

  function koalaAttackFor(o,label){
    const book=koalaWatchAttackSource(o);
    if(!book) return {};
    const c=o.c||{};
    let channel;
    if(label){
      const text=String(label);
      const aliases=[
        [/꽃/,'bonus:flower'],[/독침|독뿜|독 뿜/,'bonus:sting'],
        [/스시/,'bonus:sushi'],[/선글라스/,'bonus:glasses'],
        [/장난기/,'prankCd'],[/말썽/,'troubleCd'],
        [/플라즈마/,'plasmaCd'],[/블래스터/,'sansCd'],
        [/전기|활력/,'guest:letter'],[/조림/,'jrCd'],
        [/다이아/,'diaCd'],[/머니|돈뿌|돈 뿌/,'dhCd']
      ];
      const alias=aliases.find(function(row){
        return row[0].test(text)&&book.channels.has(row[1]);
      });
      if(alias) channel=alias[1];
      if(!channel && o.extraGuest && Array.isArray(o.extraGuest.cds)){
        const arrays=Object.keys(c).map(function(key){return c[key];}).filter(Array.isArray);
        arrays.some(function(skills){
          const i=skills.findIndex(function(s){
            return s&&typeof s==='object'&&(s.name===text||s.kind===text);
          });
          if(i<0 || !book.channels.has('extra:'+i)) return false;
          channel='extra:'+i;
          return true;
        });
      }
      if(!channel) channel=book.labels.get(text);
      if(!channel){
        channel=book.latest;
        book.labels.set(text,channel);
      }
    }else{
      const primary=[
        ['skill','skillCd'],['plasma','plasmaCd'],['hell','hellCd'],
        ['sans','sansCd'],['root','rootCd'],['jae','jaeCd'],
        ['jam','jamCd'],['o2','o2Cd'],['ghost','ghostCd'],
        ['mono','monoCd'],['woodz','wzCd'],['dh','dhCd'],
        ['dia','diaCd'],['jorim','jrCd'],['slap','slapCd'],
        ['punch','punchCd']
      ].find(function(row){return c[row[0]]&&book.channels.has(row[1]);});
      channel=primary?primary[1]:book.latest;
    }
    return book.channels.get(channel)||book.channels.get(book.latest);
  }

  function installKoalaDefense(f){
    if(f._koalaGuardInstalled) return;

    const descriptor=Object.getOwnPropertyDescriptor(f,'hp');
    let hp=f.hp;
    Object.defineProperty(f,'hp',{
      enumerable:true,configurable:true,
      get:function(){return descriptor&&descriptor.get?descriptor.get.call(f):hp;},
      set:function(value){
        const before=descriptor&&descriptor.get?descriptor.get.call(f):hp;

            f.c.bonusKind==='koala' && f.koalaStage>=2 &&
            !(f.koalaStage===3 && f.koalaQueenLives===1) &&
            Number.isFinite(value) && value<before){
          const source=combatDamageOwner||damageSource(f);
          const action=koalaDamageAction||koalaAttackFor(source);
          let blocked=koalaBlockedAttacks.get(action);
          if(blocked && blocked.has(f)) return;
          if(f._koalaBlocks>0){
            if(!blocked){

            play('clash');
            return;

        if(descriptor&&descriptor.set) descriptor.set.call(f,value);
        else hp=value;
      }
    });
  }

      if(s.tg){ const want=Math.atan2(s.tg.y-P.y,s.tg.x-P.x); let d=want-s.base; d=Math.atan2(Math.sin(d),Math.cos(d)); s.base+=d*Math.min(1,dt*3); }
      s.ang=s.base+Math.sin(s.t*9)*1.15;
      const dur=R.selfieDur;
      const SLn=R.selfieLen*bossR(P);
      s.len = s.t<0.25 ? SLn*s.t/0.25 : s.t<dur-0.25 ? SLn : SLn*Math.max(0,(dur-s.t)/0.25);
      const ca=Math.cos(s.ang), sa=Math.sin(s.ang);
      const ax=P.x+ca*P.r, ay=P.y+sa*P.r, ex=P.x+ca*(P.r+s.len), ey=P.y+sa*(P.r+s.len);
      for(let h=s.hits.length-1;h>=0;h--){ s.hits[h].cd-=dt; if(s.hits[h].cd<=0) s.hits.splice(h,1); }
      for(const tg of ents){
        if(tg.team===P.team||tg.hp<=0||s.hits.some(function(q){ return q.tg===tg; })) continue;
        if(dSegPt(ax,ay,ex,ey,tg.x,tg.y)<tg.r+6){
          s.hits.push({tg:tg,cd:R.selfieHitGap}); s.flash=0.15;
          tg.hp-=R.selfieDmg; tg.blink=0.13; knock(tg,P,R.selfieKnock);
          FX.burst(tg.x,tg.y,{count:12,colors:['#3E6FD8','#fff'],speed:6});
          FX.popText(tg.x,tg.y-30,'찰칵! -'+R.selfieDmg,{color:'#3E6FD8',size:22});
          play('hit');
        }
      }
      if(s.t>=dur) sticks.splice(i,1);
    }
  }

  // ===== 김재원: 독버섯 / 폭팔버섯 =====
  function jaeSkill(P,tgt){
    if(Math.random()<0.5){
      shout(P,'여섯! 버섯!','#7B3FB5');
      shrooms.push({o:P,team:P.team,x:P.x,y:P.y,tg:tgt,life:3,spin:0});
      play('whoosh');
    } else {
      shout(P,'여섯! 버섯!','#E07A00');
      const a=Math.atan2(tgt.y-P.y,tgt.x-P.x);
      booms.push({o:P,team:P.team,x:P.x+Math.cos(a)*(P.r+16),y:P.y+Math.sin(a)*(P.r+16),tg:tgt,t:0,lastSec:0});
      play('summon'); FX.sparkle(P.x,P.y);
    }
  }
  function updateJae(dt){
    // 독버섯 투척
    for(let i=shrooms.length-1;i>=0;i--){
      const p=shrooms[i], J=p.o.c.jae; p.life-=dt; p.spin+=dt*10;
      // 샌즈가 피한 버섯: 그대로 직진하다 사라짐(맞지 않음)
      if(p.miss){ p.x+=p.mvx*dt; p.y+=p.mvy*dt; if(p.life<=0) shrooms.splice(i,1); continue; }
      if(!p.tg||p.tg.hp<=0||p.tg.dead) p.tg=nearestEnemy(p);
      if(!p.tg||p.life<=0){ shrooms.splice(i,1); continue; }
      const dx=p.tg.x-p.x, dy=p.tg.y-p.y, d=Math.hypot(dx,dy)||1;
      p.x+=dx/d*J.throwSpeed*dt; p.y+=dy/d*J.throwSpeed*dt;
      // 샌즈: 맞기 전에 미리 옆으로 피함
      const sf=p.tg;
      if(sf.c && sf.c.sans && !(sf.morphT>0) && sf.dodges<sansDodgeMax(sf) && d<sf.r+60){
        sf.dodges++;
        if(!(sf.dodgeT>0)){ sf.preVx=sf.vx; sf.preVy=sf.vy; }
        sf.dodgeT=0.28;
        const ux=dx/d, uy=dy/d, a=Math.random()<0.5?1:-1;
        sf.vx=-uy*a*480; sf.vy=ux*a*480;
        p.miss=true; p.mvx=ux*J.throwSpeed; p.mvy=uy*J.throwSpeed; p.life=0.5;
        FX.burst(sf.x,sf.y,{count:8,colors:['#5AB9FF','#ffffff'],speed:4});
        FX.popText(sf.x,sf.y-36,'MISS',{color:'#8a8a8a',size:22});
        play('dodge');
        continue;
      }
      if(d<p.tg.r+14){
        const tg=p.tg;
        tg.poisonN=Math.round(J.poisonDur); tg.poisonT=1; tg.poisonDmg=J.poisonDps; tg.blink=0.15;
        shout(tg,'윽!','#7B3FB5');
        FX.burst(tg.x,tg.y,{count:16,colors:['#9B5DE5','#C9F27A','#fff'],speed:6});
        FX.popText(tg.x,tg.y-34,'중독!',{color:'#7B3FB5',size:24});
        play('ugh'); shrooms.splice(i,1);
      }
    }
    // 독: 1초마다 피해
    alive().forEach(function(e){
      if(!(e.poisonN>0)) return;
      e.poisonT-=dt;
      if(e.poisonT<=0){
        e.poisonT+=1; e.poisonN--; e.hp-=e.poisonDmg; e.blink=0.1;
        FX.popText(e.x,e.y-30,'-'+e.poisonDmg,{color:'#7B3FB5',size:20});
        shout(e,'윽!','#7B3FB5'); play('ugh');
      }
    });
    // 폭팔버섯: 상대에게 다가가다 5초 후 펑
    for(let i=booms.length-1;i>=0;i--){
      const b=booms[i], J=b.o.c.jae; b.t+=dt;
      if(!b.tg||b.tg.hp<=0||b.tg.dead) b.tg=nearestEnemy(b);
      if(b.tg){ const dx=b.tg.x-b.x, dy=b.tg.y-b.y, d=Math.hypot(dx,dy)||1;
        if(d>b.tg.r+10){ b.x+=dx/d*J.boomSpeed*dt; b.y+=dy/d*J.boomSpeed*dt; } }
      b.x=Math.max(AX0+16,Math.min(AX1-16,b.x)); b.y=Math.max(AY0+16,Math.min(AY1-16,b.y));
      const sec=Math.floor(b.t); if(sec>b.lastSec){ b.lastSec=sec; play('tick'); }
      if(b.t>=J.boomFuse){
        FX.explode(b.x,b.y,{power:1.3}); FX.flash({color:'#FFB347',alpha:0.35});
        play('boom'); hitstop=0.1;
        alive().forEach(function(e){
          if(e.team===b.team||e.hp<=0) return;
          const d=Math.hypot(e.x-b.x,e.y-b.y);
          if(d-e.r<=J.boomR*bossR(b.o)){ if(e.c && e.c.sans) e.missStill=true; e.hp-=J.boomDmg; e.blink=0.25; knock(e,b,J.boomKnock);
            FX.popText(e.x,e.y-40,'펑! -'+J.boomDmg,{color:'#E07A00',size:28}); }
        });
        booms.splice(i,1);
      }
    }
  }

  function isPain(b){
    return b.slapHold>0 && !slaps.some(function(s){ return s.o===b; });
  }

  function updatePunches(dt){
    for(let i=punches.length-1;i>=0;i--){
      const p=punches[i], pu=p.o.c.punch; p.t+=dt;
      if(p.t<pu.windup && p.tg && p.tg.hp>0 && !p.tg.dead){ p.lx=p.tg.x; p.ly=p.tg.y; }
      if(!p.hit && p.t>=pu.windup+pu.slam){
        p.hit=true; const tg=p.tg;
        FX.explode(p.lx,p.ly,{power:1.2});
        FX.flash({color:'#ffffff',alpha:0.4});
        play('slap');
        if(tg && tg.hp>0 && !tg.dead && Math.hypot(tg.x-p.lx,tg.y-p.ly)<tg.r+60*bossR(p.o)){
          tg.hp-=pu.dmg; tg.blink=0.25;
          // 엄마 펀치는 위에서 내려찍으니 아래로 떨어진다(샌즈 제외)
          if(!(tg.c && tg.c.sans) && isFinite(tg.vx) && isFinite(tg.vy)){ tg.vx*=0.2; tg.vy=Math.abs(tg.vy)*0.2+pu.knock; }
          FX.popText(tg.x,tg.y-40,'엄마의 펀치! -'+pu.dmg,{color:'#E0457B',size:26});
          hitstop=0.12;
        }
      }
      if(p.t>=pu.windup+pu.slam+pu.hold) punches.splice(i,1);
    }
  }

  function updateSlaps(dt){
    updatePunches(dt);
    for(let i=slaps.length-1;i>=0;i--){
      const s=slaps[i], sl=s.sl||s.o.c.slap; s.t+=dt;
      if(s.t<sl.windup){ s.lx=s.tg.x; s.ly=s.tg.y; }
      if(!s.hit && s.t>=sl.windup+sl.slam){
        s.hit=true; const tg=s.tg;
        const critConfig=s.o.c.slap;
        const critical=Math.random()<(critConfig.critChance||0);
        const damage=sl.dmg*(critical?critConfig.critMul:1);
        tg.hp-=damage; tg.blink=0.25; knock(tg,s.o,sl.knock);
        // 보스전: 보스가 도전자를 때리면 실제로 들어가는 배율 피해를 보여준다
        const shownDmg=Math.round(damage*((mode==='boss'&&s.o.isBoss&&!tg.isBoss)?TUNING.bossDmg:1));
        if(s.rage){
          FX.burst(tg.x,tg.y,{count:10,colors:['#E0457B','#FFC0D3','#fff'],speed:6});
          FX.popText(tg.x,tg.y-36,(critical?'크리티컬! -':'퍽! -')+shownDmg,{color:critical?'#A855F7':'#E0457B',size:20});
          play('slap'); hitstop=0.03;
          // 분노 모드 손바닥 10번마다 체력 회복
          const o=s.o; o.rageHits=(o.rageHits||0)+1;
          if(sl.healEvery && o.rageHits%sl.healEvery===0 && o.hp>0 && !o.dead){
            o.hp=Math.min(o.maxHp,o.hp+sl.heal*(mode==='boss'&&o.isBoss?TUNING.bossAll:1));
            FX.sparkle(o.x,o.y);
            FX.popText(o.x,o.y-44,'+'+Math.round(sl.heal*bossR(o)),{color:'#3FBF5F',size:26});
          }
        } else {
          FX.explode(tg.x,tg.y,{power:1.1});
          FX.flash({color:'#ffffff',alpha:0.45});
          FX.shake({strength:8,duration:250});
          FX.popText(tg.x,tg.y-40,(critical?'크리티컬! -':'짝! -')+shownDmg,{color:critical?'#A855F7':'#E0457B',size:30});
          play('slap'); hitstop=0.12;
        }
      }
      if(s.t>=sl.windup+sl.slam+sl.hold) slaps.splice(i,1);
    }
  }

  function fireWave(P){
    const sk=P.c.skill;
    if(P.skillIdx===0 || !P._koalaWaterAction) P._koalaWaterAction={};
    waves.push({o:P,koalaAction:P._koalaWaterAction,r:P.r,max:sk.range*bossR(P),dmg:sk.hits[P.skillIdx++]||0,hits:[]});
    play('water');
    try{ if(FX.splash) FX.splash(P.x,P.y); else FX.burst(P.x,P.y,{count:14,colors:['#3BA7F0','#BDE6FF','#fff'],speed:6}); }catch(e){}
    if(P.c.waterAwaken&&!P._waterAwakened&&P.skillIdx===sk.hits.length){
      P._waterCastCount=(P._waterCastCount||0)+1;
      if(P._waterCastCount>=P.c.waterAwaken.casts&&customCanEvolve(P)) testEvolveOpponent(P);
    }
  }

  function updateWaves(dt){
    const ents=alive();
    for(let i=waves.length-1;i>=0;i--){
      const w=waves[i], sk=w.o.c.skill;
      w.r+=sk.speed*dt;
      for(const tgt of ents){
        if(tgt.team===w.o.team || w.hits.indexOf(tgt)>=0) continue;
        const d=Math.hypot(tgt.x-w.o.x,tgt.y-w.o.y);
        if(d-tgt.r<=w.r && d-tgt.r<=w.max){
          w.hits.push(tgt);
          withKoalaAttack(w.koalaAction||(w.koalaAction={}),w.o,function(){tgt.hp-=w.dmg;});
          tgt.blink=0.13; knock(tgt,w.o,sk.knock);
          FX.burst(tgt.x,tgt.y,{count:12,colors:['#3BA7F0','#BDE6FF','#fff'],speed:6});
          FX.popText(tgt.x,tgt.y-30,'-'+w.dmg,{color:'#1B6FB0',size:22});
          play('hit');
        }
      }
      if(w.r>=w.max) waves.splice(i,1);
    }
  }

  // A의 무기가 B를 때리는지
  function strike(A,B){
    if(A.cdHit>0) return;
    if(B.hideT>0) return; // 은신 중인 상대는 맞지 않는다
    const aw=weapon(A);
    if(!aw) return;
    if(dSegPt(aw.ax,aw.ay,aw.ex,aw.ey,B.x,B.y)>=B.r) return;
    A.cdHit=TUNING.hitCooldown;
    const dmg=A.c.dmg+(A.c.grow?Math.round((A.len-A.c.len)*0.15):0);
    B.hp-=dmg; B.blink=0.13; knock(B,A,TUNING.hitKnock);
    if(A.c.grow) A.len=Math.min(TUNING.swordMax,A.len+TUNING.swordGrow);
    FX.burst(B.x,B.y,{count:12,colors:[B.color,'#fff'],speed:6});
    FX.popText(B.x,B.y-30,'-'+dmg,{color:'#1E1B2E',size:22});
    play('hit'); hitstop=TUNING.hitstop;
  }

        play('go'); FX.burst(300,300,{count:24,colors:['#FFC145','#FF5A5F','#2EC4B6','#fff'],speed:8});
      } else if(n!==lastNum){ lastNum=n; play('count'); }

    (function(){

      function credit(v,loss){
        let best=null,bd=1e9,best2=null,bd2=1e9;
        pool.forEach(function(c){ if(c===v||c.team===v.team) return;
          const o=c.isMinion?c.owner:c; if(!o||F.indexOf(o)<0) return;

        o._dmg=(o._dmg||0)+loss; return o;

      if(foe===f) foe=clones[0];
      FX.burst(f.x,f.y,{count:16,colors:['#76E83F','#D9FFB4'],speed:4});
      FX.popText(f.x,f.y-34,'부활 클론 2명!',{color:'#48A52B',size:20});
      rickSound('rickPortal');
    });
    if(rule==='killmorph'){
      const kills=new Map();
      newly.forEach(function(v){
        const source=v._lastBy;
        const by=source&&combatRoot(source.base||source);
        if(!by||by===v||by.team===v.team||by.dead||by.hp<=0||F.indexOf(by)<0) return;
        if(by!==source) by._ko=(by._ko||0)+1;
        kills.set(by,(kills.get(by)||0)+1);
      });
      kills.forEach(function(count,by){
        for(let i=0;i<count;i++) swapKillAbility(by);
      });
    }
    // 태그팀: 쓰러진 선수 대신 같은 팀 다음 선수가 교대 출전
    if(mode==='tag') newly.forEach(function(f){
      const q=tagQ[f.team]; if(!q||!q.length) return;
      // 같은 팀 선수(수투두오 박사·조수)가 아직 링에 있으면 교대하지 않는다
      if(F.some(function(o){ return o!==f && o.team===f.team && !o.dead; })) return;
      const id=q.shift(), tm=f.team;
      const n=makeFighter(ROSTER[id],tm===0?AX0+60:AX1-60,300,tm===0?1:-1);
      n.rid=id; n.ang=tm===0?0:Math.PI; rv(n);
      const k=F.findIndex(function(o){ return o.team===tm && o.dead; });
      const gone=F.filter(function(o){ return o.team===tm && o.dead; });
      F=F.filter(function(o,i){ return i===k || !(o.team===tm && o.dead); });
      const k2=F.indexOf(gone[0]); if(k2>=0) F[k2]=n; else F.push(n);
      gone.forEach(function(o){ tagOut.push(o); o._tagged=true; });
      if(n.c.duo){ const a=spawnAssist(n); rv(a); }
      player=F[0]; foe=F[1];
      banner={text:'🔁 TAG! '+n.name,t:1.2};
      FX.sparkle(n.x,n.y); play('go');
    });
    if(rule==='wave'){
      const king=F.find(function(f){ return f._waveKing; });
      if(king && (king.dead || !teamAlive(king.team===0?1:0))){
        const survivor=king.dead?
          F.find(function(f){ return f.team!==king.team && !f.dead; })||
          minions.find(function(m){ return m.team!==king.team && m.hp>0 && !m.isDoc; }):
          king;
        finish(survivor||null,newly);
        draw(); return;
      }
    }
    // 어느 쪽이 이겨도 살아남은 선수가 다음 웨이브로 진출
    if(rule==='wave' && teamAlive(0)!==teamAlive(1)){
      const winTeam=teamAlive(0)?0:1;
      const nextTeam=winTeam===0?1:0;
      const advancing=F.find(function(f){ return f.team===winTeam && !f.dead; })||minions.find(function(m){ return m.team===winTeam && m.hp>0 && !m.isDoc; });
      waveNo++;
      F=F.filter(function(f){ return f.team===winTeam; });
      minions=minions.filter(function(m){ return m.team===winTeam && m.hp>0; });
      F.forEach(function(f){ if(!f.dead) f.hp=Math.min(f.maxHp,f.hp+TUNING.waveHeal); });
      minions.forEach(function(m){ if(m.maxHp>0) m.hp=Math.min(m.maxHp,m.hp+TUNING.waveHeal); });
      const bossEvery=Math.max(1,Math.floor(TUNING.waveBossEvery));
      const kingWave=waveNo>=TUNING.waveKingWave;
      const bossTier=kingWave?Math.floor(waveNo/bossEvery)+1:waveNo%bossEvery===0?Math.floor(waveNo/bossEvery):0;
      const cnt=bossTier?1:1+Math.floor((waveNo-1)/Math.max(1,TUNING.waveAddEvery));
      const nextX=winTeam===0?AX1-80:AX0+80;
      const nextDir=winTeam===0?-1:1;
      let first=null;
      const pool=combatRosterIds();
      for(let k=0;k<cnt;k++){
        const id=pool[Math.floor(Math.random()*pool.length)];
        const yy=AY0+(AY1-AY0)*(k+1)/(cnt+1);
        const n=makeFighter(ROSTER[id],nextX,yy,nextDir);
        n.rid=id; n.ang=nextDir===1?0:Math.PI; n.spawnT=0.6; n.team=nextTeam;
        const waveHpMul=TUNING.waveHpBase+TUNING.waveHpUp*(waveNo-1);
        if(bossTier){
          n._waveBossTier=bossTier;
          n.isBoss=true;
          n._waveKing=kingWave;
          if(kingWave){ n.name='👑 왕'; n._nm=n.name; n.color='#FFC145'; }
          n.bossMul=waveHpMul*(TUNING.waveBossHpMul+TUNING.waveBossHpGrowth*(bossTier-1))*(kingWave?TUNING.waveKingHpMul:1);
          n.r*=TUNING.bossSize;
          n.maxHp=n.hp=Math.max(1,Math.round(n.maxHp*n.bossMul));
          n.hp0=n.hp;
        }else{
          n.maxHp=n.hp=Math.max(1,Math.round(n.maxHp*waveHpMul));
        }
        rv(n); F.push(n); if(!first) first=n;
        if(n.c.duo){ const a=spawnAssist(n); if(a) rv(a); }
        FX.sparkle(n.x,n.y);
        if(bossTier) shout(n,kingWave?'👑 최종 보스 왕 등장!':'보스 '+bossTier+'단계 등장!',kingWave?'#FFC145':'#E0242B',3);
      }
      player=F.find(function(f){ return f.team===winTeam && !f.dead; })||F.find(function(f){ return f.team===winTeam; })||first;
      foe=first||foe;
      curLabel='🛡️ 웨이브 '+waveNo+(kingWave?' · 👑 최종 보스 왕':bossTier?' · 보스 '+bossTier+'단계':cnt>1?' · 도전자 '+cnt+'명':'');
      banner={text:kingWave?'👑 왕을 잡으면 클리어!':bossTier?'보스 '+bossTier+'단계 · 웨이브 '+waveNo:(advancing?advancing.name+' 진출! · ':'')+'웨이브 '+waveNo,t:bossTier?2.5:1.2};
      play('go');
      if(waveNo%50===0){
        state='wavePause';
        document.getElementById('ovKo').textContent='🛡️ 웨이브 '+waveNo+' 도달!';
        const ow=document.getElementById('ovWin');
        ow.textContent='계속 진행할까요?';
        ow.style.color='#FFC145';
        document.getElementById('ovSub').textContent='여기서 마치거나 현재 상태로 계속할 수 있어요.\n다음 확인: '+(waveNo+50)+'웨이브';
        document.getElementById('again').textContent='계속하기 ▶';
        document.getElementById('pickBtn').textContent='여기서 종료';
        renderStats();
        document.getElementById('over').style.display='flex';
        draw(); return;
      }
    }
    if(rule==='zombie'){
      const factions=new Map();
      const survivors=F.filter(function(f){ return !f.dead&&f.hp>0; });
      survivors.forEach(function(f){
        const owner=f._zombieOwner||f.name;
        if(!factions.has(owner)) factions.set(owner,f.team);
      });
      survivors.forEach(function(f){
        partySyncTeam(f,factions.get(f._zombieOwner||f.name));
      });
      minions.forEach(function(m){
        let owner=m.owner||m.o;
        const seen=new Set();
        while(owner&&F.indexOf(owner)<0&&!seen.has(owner)){
          seen.add(owner);
          owner=owner.owner||owner.o||owner.duoOf||owner.koalaSwarmOwner||owner.koalaMother;
        }
        if(owner&&F.indexOf(owner)>=0){
          m.team=owner.team;
          m._zombieOwner=owner._zombieOwner||owner.name;
        }
      });
    }
    const teams=[]; F.forEach(function(f){ if(teams.indexOf(f.team)<0) teams.push(f.team); });
    const live=teams.filter(teamAlive);
    const qRep=mode==='grp'&&qg&&qg.stage==='rep'&&live.length<=qg.need;
    if(live.length<=1||qRep){
      let w=null; // 동시에 전멸 → 무승부
      if(live.length===1) w=F.filter(function(f){ return f.team===live[0]; })[0];
      finish(w,newly);
    } else {
      newly.forEach(function(f){
        FX.explode(f.x,f.y,{power:1});
        if(f._tagged) FX.popText(f.x,f.y-30,f.name+' 아웃!',{color:'#1E1B2E',size:20});
        else if(F.some(function(o){ return o!==f && o.team===f.team && !o.dead; })) FX.popText(f.x,f.y-30,f.name+' 탈락!',{color:'#1E1B2E',size:20});
        else if(teamAlive(f.team)){
          const lm=minions.find(function(m){ return m.team===f.team && m.hp>0 && !m.isDoc; });
          const isHaon=!!(lm && lm.c && lm.c.haon);
          FX.popText(f.x,f.y-30,(isHaon?'김하온':lm.name)+'이 남았다!',{color:isHaon?'#2E7D32':'#1E1B2E',size:isHaon?26:20});
          if(isHaon){ shout(lm,'김하온이 남았다!','#2E7D32',2); FX.sparkle(lm.x,lm.y); }
        }
        else FX.popText(f.x,f.y-30,f.name+' 탈락!',{color:'#1E1B2E',size:20});
        play('kill');
      });
    }
    draw();
  }

  function rr(x,y,w,h,r){ g.beginPath(); g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r); g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath(); }

  function drawArena(){
    syncMapPicker();
    const mapId=activeArenaMap();
    if(mapId!=='arena'){
      drawArenaMap(g,mapId,[AX0,AY0,AX1,AY1],DPR);
      return;
    }
    // 조명·관중석 장식 — 화면 기준으로 그림
    const tt=t||0;
    g.save(); g.setTransform(DPR,0,0,DPR,0,0);
    // 스포트라이트 두 줄기
    for(let i=0;i<2;i++){
      const lx=i?585:15, tx=300+Math.sin(tt*0.6+i*2.2)*110;
      const gr=g.createLinearGradient(lx,0,tx,600);
      gr.addColorStop(0,'rgba(255,236,180,.42)'); gr.addColorStop(1,'rgba(255,236,180,0)');
      g.fillStyle=gr; g.beginPath(); g.moveTo(lx-8,0); g.lineTo(lx+8,0); g.lineTo(tx+120,600); g.lineTo(tx-120,600); g.closePath(); g.fill();
    }
    // 관중 실루엣 (3줄)
    const CC=['#FF5A5F','#2EC4B6','#FFC145','#8E7DFF'];
    for(let r=0;r<3;r++) for(let i=0;i<16;i++){
      const y=14+i*38+(r%2)*19, c=CC[(i+r)%4], bob=Math.sin(tt*4+i*1.7+r)*1.5;
      g.globalAlpha=0.26-r*0.04; g.fillStyle=c;
      [16+r*26, 584-r*26].forEach(function(x){
        g.beginPath(); g.arc(x,y+bob,8,0,6.28); g.fill();
        g.beginPath(); g.arc(x,y+bob+16,12,Math.PI,0); g.fill();
      });
    }
    // 카메라 플래시
    for(let k=0;k<5;k++){
      const cyc=tt*1.1+k*0.29, ph=cyc%1;
      if(ph<0.07){
        const n=Math.floor(cyc), fy=20+((k*137+n*91)%560), fx=k%2?586-((k*13+n*7)%70):14+((k*17+n*11)%70);
        g.globalAlpha=(1-ph/0.07)*0.9; g.fillStyle='#fff';
        g.beginPath(); g.arc(fx,fy,7,0,6.28); g.fill();
        g.globalAlpha*=0.4; g.beginPath(); g.arc(fx,fy,16,0,6.28); g.fill();
      }
    }
    g.restore();
    g.globalAlpha=1;
    // 링
    const RW=AX1-AX0, RH=AY1-AY0, cx=(AX0+AX1)/2, cy=(AY0+AY1)/2;
    g.save();
    if(bonusJellies.length){
      const J=bonusJellies[bonusJellies.length-1], R=TUNING.rdsy;
      const envelope=Math.sin(Math.PI*Math.min(1,J.time/R.shakeDuration));
      g.translate(Math.sin(J.time*Math.PI*4)*envelope*Math.min(6,R.shakeMotion),Math.sin(J.time*Math.PI*4)*envelope*2);
    }
    g.fillStyle='rgba(14,12,24,.28)'; rr(AX0-14,AY0-6,RW+28,RH+28,22); g.fill();
    g.fillStyle='#1E1B2E'; rr(AX0-14,AY0-14,RW+28,RH+28,22); g.fill();
    g.strokeStyle='#FFC145'; g.lineWidth=2; rr(AX0-10,AY0-10,RW+20,RH+20,18); g.stroke();
    // 바닥
    const fg=g.createRadialGradient(cx,cy,20,cx,cy,Math.max(RW,RH)*0.75);
    fg.addColorStop(0,'#FFFDF6'); fg.addColorStop(1,'#EADBC0');
    g.fillStyle=fg; rr(AX0,AY0,RW,RH,10); g.fill();
    g.save(); rr(AX0,AY0,RW,RH,10); g.clip();
    const quizOwner=F.find(function(o){
      const E=o.extraGuest,q=E&&E.duolingoQuiz;
      return !o.dead && o.hp>0 && E && E.config===o.c && q && q.left>0 &&
        q.target && !q.target.dead && q.target.hp>0;
    });
    if(quizOwner){
      const q=quizOwner.extraGuest.duolingoQuiz;
      g.save();
      g.fillStyle='rgba(88,204,2,.23)';
      g.fillRect(AX0,AY0,RW/2,RH);
      g.fillStyle='rgba(237,83,83,.23)';
      g.fillRect(cx,AY0,RW/2,RH);
      g.textAlign='center';g.textBaseline='middle';
      g.font='900 '+(48/CAM.s)+'px sans-serif';
      g.fillStyle='rgba(49,155,20,.55)';g.fillText('O',AX0+RW/4,cy);
      g.fillStyle='rgba(205,48,48,.55)';g.fillText('X',AX0+RW*3/4,cy);
      const panelW=Math.min(RW-16/CAM.s,350/CAM.s),panelH=70/CAM.s;
      g.fillStyle='rgba(255,255,255,.95)';
      rr(cx-panelW/2,AY0+8/CAM.s,panelW,panelH,10/CAM.s);g.fill();
      g.fillStyle='#285615';g.font='bold '+(19/CAM.s)+'px sans-serif';
      g.fillText(q.text,cx,AY0+31/CAM.s,panelW-12/CAM.s);
      g.fillStyle='#384435';g.font='bold '+(12/CAM.s)+'px sans-serif';
      g.fillText(q.target.name+' · '+q.left.toFixed(1)+'초 뒤 위치로 선택',cx,AY0+58/CAM.s,panelW-12/CAM.s);
      g.restore();
    }
    // 코너 매트 (왼쪽 레드 · 오른쪽 블루)
